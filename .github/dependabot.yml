version: 2
updates:
  # JS/TS dependencies (pnpm workspaces) — grouped to keep PR noise low.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Non-major updates batched into a single PR per group.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      expo-and-react-native:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "react-native"
          - "react-native-*"
          - "@expo/*"
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
    ignore:
      # Expo SDK / RN majors are coordinated upgrades — handle manually.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
