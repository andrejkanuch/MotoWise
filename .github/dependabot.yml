version: 2
updates:
  # JS/TS dependencies (pnpm workspaces) — grouped to keep PR noise low.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Order matters: a dependency joins the FIRST group it matches. Keep the
      # specific pattern groups above the catch-all minor-and-patch, or the
      # catch-all would swallow their minor/patch updates first.
      expo-and-react-native:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "react-native"
          - "react-native-*"
          - "@expo/*"
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
      # Catch-all for everything else non-major.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK / RN majors are coordinated upgrades — handle manually.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # react-native's version is OWNED BY THE EXPO SDK (SDK 56 pins 0.85.3).
      # Dependabot must never bump it independently: RN releases like 0.85 -> 0.86
      # are *minor* in semver, so a major-only ignore let #150 through and pushed
      # RN ahead of what Expo 56 and react-native-reanimated@4.3.1 (peer 0.81-0.85)
      # support, breaking `pod install`. It moves only on a manual Expo SDK upgrade,
      # so ignore ALL bot updates for it. Same reasoning applies to reanimated /
      # worklets if they ever drift — extend this list rather than merging a bump.
      - dependency-name: "react-native"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
