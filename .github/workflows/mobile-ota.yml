name: Mobile OTA Update

# Manually-triggered EAS Update (over-the-air) for the mobile app.
# Run it from the GitHub mobile app or web: Actions → "Mobile OTA Update" →
# "Run workflow", pick the branch to publish from and edit the message.
#
# Requirements (one-time setup, doable from a phone browser at
# github.com → repo Settings → Secrets and variables → Actions):
#   - Secret EXPO_TOKEN: an Expo access token (Expo dashboard → Account →
#     Access Tokens) with permission to publish updates for project
#     359ae282-329d-455d-b9f3-64919afad0b4 (owner: andykeny).
#
# Production EXPO_PUBLIC_* config is pulled from EAS-hosted environment
# variables via `--environment production` (Expo dashboard → project →
# Environment variables). This replaces the local .env.production step from
# the manual workflow, so CI never needs a committed env file. If any
# EXPO_PUBLIC_* var is NOT stored on EAS, add it there before running, or the
# bundle will ship with missing config.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS Update branch to publish to
        required: true
        default: production
      message:
        description: Update message shown in the EAS dashboard
        required: true
        default: "fix: onboarding paywall Android crash (custom variables)"

concurrency:
  group: mobile-ota-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Pass workflow inputs through env (not inline ${{ }} in run) so a
          # crafted message can't inject shell code into the runner.
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          pnpm dlx eas-cli@latest update \
            --branch "$INPUT_BRANCH" \
            --message "$INPUT_MESSAGE" \
            --environment production \
            --non-interactive
      # Source maps for the bundle just published, from the same `dist` export.
      # Without them Sentry symbolicates an OTA's stack frames against the wrong
      # bundle (MOTO-VAULT-REACT-NATIVE-3V pointed at an unrelated function for this
      # reason). The bundle cannot be rebuilt byte-identically later, so this is the
      # only chance to upload them. Needs the SENTRY_AUTH_TOKEN repository secret;
      # without it the publish still stands and this step only warns.
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: lominic
          SENTRY_PROJECT: moto-vault-react-native
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set; this update's source maps were not uploaded."
            exit 0
          fi
          npx sentry-expo-upload-sourcemaps dist
