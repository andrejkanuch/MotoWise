packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
injectWorkspacePackages: true
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  graphql: ^16.14.2
  lightningcss: 1.30.1
  protobufjs: '>=8.8.0'
  shell-quote: '>=1.9.0'
  # Xcode 27 (required by @iternio/react-native-auto-play 0.7.0, #247): expo-modules-jsi
  # 57.0.4's "Build ExpoModulesJSI xcframework" phase prints Xcode 27's new foreign
  # reference ownership warnings as errors while exiting 0, which fails `xcodebuild
  # archive` ("PhaseScriptExecution emitted errors"). Fixed in 57.0.5 (expo/expo#49120),
  # inside expo-modules-core 57.0.10's declared ~57.0.4 range. Drop this once the Expo
  # SDK 57 patch bump brings expo-modules-core onto a release that requires >=57.0.5.
  expo-modules-jsi: 57.0.5
# Version-pinned bypass of pnpm 11's default 1-day minimumReleaseAge for the Next.js
# 16.3.8 security release (GHSA-cjq9-62q9-8jv4 SSRF in image optimization, plus five
# cache-poisoning / disclosure fixes): published 2026-09-30, adopted 2026-10-01 (#248).
# Pinned to exactly 16.3.8, so later versions still wait out the cooling period.
# Safe to delete once 16.3.8 is more than a day old.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@next/third-parties@16.3.8'
  - next@16.3.8
