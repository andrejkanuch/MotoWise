packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
injectWorkspacePackages: true
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  graphql: ^16.14.2
  lightningcss: 1.30.1
  protobufjs: '>=7.6.5'
  shell-quote: '>=1.9.0'
