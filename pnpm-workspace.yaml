packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
injectWorkspacePackages: true
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  graphql: ^16.14.2
  lightningcss: 1.30.1
  protobufjs: '>=7.6.4'
  shell-quote: '>=1.11.0'
  # Xcode 27 (required by @iternio/react-native-auto-play 0.7.0, #247): expo-modules-jsi
  # 57.0.4's "Build ExpoModulesJSI xcframework" phase prints Xcode 27's new foreign
  # reference ownership warnings as errors while exiting 0, which fails `xcodebuild
  # archive` ("PhaseScriptExecution emitted errors"). Fixed in 57.0.5 (expo/expo#49120),
  # inside expo-modules-core 57.0.10's declared ~57.0.4 range. Drop this once the Expo
  # SDK 57 patch bump brings expo-modules-core onto a release that requires >=57.0.5.
  expo-modules-jsi: 57.0.5
  # Security pins for Dependabot advisories on transitive dependencies (2026-10-08).
  # Each selector is scoped to the major (or 0.x minor) line already in the lockfile
  # and lifts it to the first patched release on that same line — no major is crossed.
  # Drop an entry once the dependents' own ranges resolve past it (re-run
  # `pnpm why <pkg>` after removing it; the lockfile must not fall back).
  '@fastify/busboy@^3': ^3.2.2
  '@graphql-tools/executor-legacy-ws@^1': ^1.1.35
  '@protobufjs/utf8@^1': ^1.1.1
  '@xmldom/xmldom@~0.8': ~0.8.15
  '@xmldom/xmldom@~0.9': ~0.9.12
  ajv@^8: ^8.18.0
  body-parser@^1: ^1.20.6
  body-parser@^2: ^2.3.0
  brace-expansion@^1: ^1.1.21
  brace-expansion@^2: ^2.1.7
  brace-expansion@>=3 <6: ^5.0.12
  compression@^1: ^1.8.2
  dompurify@^3: ^3.4.16
  fast-uri@^3: ^3.1.8
  fflate@~0.4: ~0.4.9
  form-data@^4: ^4.0.6
  immutable@^5: ^5.1.8
  js-yaml@^3: ^3.15.2
  js-yaml@^4: ^4.3.2
  lodash@^4: ^4.18.0
  nanoid@^3: ^3.3.18
  path-to-regexp@~0.1: ~0.1.13
  path-to-regexp@^8: ^8.4.0
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.4
  postcss@^8: ^8.5.23
  qs@^6: ^6.16.0
  sharp@~0.35: ~0.35.5
  smol-toml@^1: ^1.9.0
  source-map-js@^1: ^1.2.2
  undici@^6: ^6.28.1
  undici@^7: ^7.29.1
  vite@^7: ^7.3.5
  yaml@^2: ^2.8.3
# Version-pinned bypass of pnpm 11's default 1-day minimumReleaseAge for the Next.js
# 16.3.8 security release (GHSA-cjq9-62q9-8jv4 SSRF in image optimization, plus five
# cache-poisoning / disclosure fixes): published 2026-09-30, adopted 2026-10-01 (#248).
# Pinned to exactly 16.3.8, so later versions still wait out the cooling period.
# Safe to delete once 16.3.8 is more than a day old.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@next/third-parties@16.3.8'
  - next@16.3.8
