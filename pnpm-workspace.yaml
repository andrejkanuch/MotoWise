packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
injectWorkspacePackages: true
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  graphql: ^16.14.2
  lightningcss: 1.30.1
  protobufjs: '>=7.6.4'
  shell-quote: '>=1.9.0'
# Version-pinned bypass of pnpm 11's default 1-day minimumReleaseAge for the Next.js
# 16.3.8 security release (GHSA-cjq9-62q9-8jv4 SSRF in image optimization, plus five
# cache-poisoning / disclosure fixes): published 2026-09-30, adopted 2026-10-01 (#248).
# Pinned to exactly 16.3.8, so later versions still wait out the cooling period.
# Safe to delete once 16.3.8 is more than a day old.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@next/third-parties@16.3.8'
  - next@16.3.8
