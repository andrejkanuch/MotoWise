<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1080px;overflow:hidden; }
.slide { width:1080px;height:1080px;position:relative;overflow:hidden;background:#D4622E; }
.slide-num { position:absolute;top:32px;right:38px;color:rgba(255,255,255,0.35);font-size:14px;font-weight:700;z-index:10;letter-spacing:1px; }
.main-img { position:absolute;top:0;left:0;width:1080px;height:1080px;object-fit:cover;object-position:50% 18%; }
.vignette { position:absolute;bottom:0;left:0;width:1080px;height:120px;background:linear-gradient(to top,rgba(0,0,0,0.18),transparent);z-index:5; }
</style>
</head>
<body>
<div class="slide">
  <img class="main-img" src="../store-previews/aso-v2/iphone-6.7/03-never-miss-a-service.jpg" alt="Never Miss a Service">
  <div class="vignette"></div>
  <div class="slide-num">4 / 7</div>
</div>
</body>
</html>
