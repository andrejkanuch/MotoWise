<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1350px;overflow:hidden; }
.slide { width:1080px;height:1350px;position:relative;overflow:hidden;background:#D4622E; }

.headline { position:absolute;top:40px;left:0;right:0;z-index:3;text-align:center; }
.h1 { font-size:152px;font-weight:800;color:#fff;letter-spacing:-3px;line-height:0.9;text-transform:uppercase; }
.h2 { font-size:72px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1;text-transform:uppercase;margin-top:6px; }

.phone-wrap { position:absolute;bottom:-420px;left:50%;transform:translateX(-50%);width:650px;z-index:2; }
.phone-wrap img { width:650px;height:auto;border-radius:61px;border:2px solid rgba(255,255,255,0.08);display:block; }

.fade { position:absolute;bottom:0;left:0;width:1080px;height:160px;background:linear-gradient(to top,rgba(180,70,20,0.65),transparent);z-index:4; }
.slide-num { position:absolute;top:28px;right:36px;color:rgba(255,255,255,0.3);font-size:14px;font-weight:700;z-index:10;letter-spacing:1px; }
</style>
</head>
<body>
<div class="slide">
  <div class="headline">
    <div class="h1">DIAGNOSE</div>
    <div class="h2">ANY ISSUE WITH AI</div>
  </div>
  <div class="phone-wrap">
    <img src="../store-previews/diagnose.png" alt="AI diagnostics">
  </div>
  <div class="fade"></div>
  <div class="slide-num">5 / 7</div>
</div>
</body>
</html>
