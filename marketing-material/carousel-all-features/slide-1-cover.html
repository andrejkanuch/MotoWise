<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1350px;overflow:hidden; }
.slide { width:1080px;height:1350px;position:relative;overflow:hidden;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center; }
.bg1 { position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(212,98,46,0.14) 0%,rgba(212,98,46,0.04) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%); }
.bg2 { position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.07) 0%,transparent 60%);top:5%;right:-5%; }
.bg3 { position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.05) 0%,transparent 60%);bottom:0;left:-5%; }

/* Feature pills row */
.pills { position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:780px;margin-bottom:44px; }
.pill { display:flex;align-items:center;gap:7px;padding:7px 18px;border-radius:100px;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:1px solid;white-space:nowrap; }
.pill-blue { background:rgba(59,130,246,0.08);border-color:rgba(59,130,246,0.22);color:#60a5fa; }
.pill-green { background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.22);color:#4ade80; }
.pill-orange { background:rgba(212,98,46,0.1);border-color:rgba(212,98,46,0.25);color:#E8723A; }
.pill-purple { background:rgba(139,92,246,0.08);border-color:rgba(139,92,246,0.22);color:#a78bfa; }
.pill-yellow { background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.22);color:#fbbf24; }

.title { position:relative;z-index:2;color:#fafafa;font-size:72px;font-weight:800;text-align:center;line-height:1.08;max-width:840px;margin-bottom:22px; }
.title span { background:linear-gradient(135deg,#D4622E,#E8723A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.subtitle { position:relative;z-index:2;color:#a3a3a3;font-size:22px;text-align:center;max-width:560px;line-height:1.55;margin-bottom:0; }

.brand { position:absolute;bottom:44px;left:48px;z-index:2;display:flex;align-items:center;gap:12px; }
.logo-icon { width:40px;height:40px;border-radius:10px;object-fit:cover; }
.logo-text { color:#fafafa;font-size:20px;font-weight:700; }
.swipe { position:absolute;bottom:48px;right:48px;z-index:2;color:#525252;font-size:14px;font-weight:500; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg1"></div>
  <div class="bg2"></div>
  <div class="bg3"></div>

  <div class="pills">
    <div class="pill pill-blue">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
      Routes
    </div>
    <div class="pill pill-yellow">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Expenses
    </div>
    <div class="pill pill-green">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/></svg>
      Maintenance
    </div>
    <div class="pill pill-orange">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Diagnostics
    </div>
    <div class="pill pill-purple">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Ride Log
    </div>
  </div>

  <div class="title">Everything Your<br>Bike Needs.<br><span>One App.</span></div>
  <div class="subtitle">Routes, expenses, maintenance, AI diagnostics, and ride logging — all in one place.</div>

  <div class="brand">
    <img class="logo-icon" src="../MotoVault-logo.png" alt="MotoVault">
    <div class="logo-text">MotoVault</div>
  </div>
  <div class="swipe">Swipe →</div>
</div>
</body>
</html>
