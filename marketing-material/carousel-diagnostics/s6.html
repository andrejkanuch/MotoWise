<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1080px;overflow:hidden; }
.slide { width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a; }
.phone-img { border-radius:36px;border:2px solid rgba(255,255,255,0.06); }
.slide-num { position:absolute;top:36px;right:40px;color:rgba(255,255,255,0.12);font-size:14px;font-weight:600;z-index:10;letter-spacing:1px; }

.s6 { display:flex;align-items:center;padding:60px 56px;gap:44px; }
.bg { position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.07) 0%,transparent 60%);right:-80px;top:50%;transform:translateY(-50%); }
.text { flex:1;z-index:2; }
.result-badge { display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:#22c55e;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px; }
.feature-title { color:#fafafa;font-size:44px;font-weight:800;line-height:1.12;margin-bottom:18px; }
.feature-desc { color:#a3a3a3;font-size:19px;line-height:1.6;margin-bottom:28px; }
.results-list { display:flex;flex-direction:column;gap:14px; }
.result-item { display:flex;align-items:center;gap:14px;color:#d4d4d4;font-size:17px;font-weight:500; }
.check { width:28px;height:28px;border-radius:50%;background:rgba(34,197,94,0.12);display:flex;align-items:center;justify-content:center;color:#22c55e;font-size:14px;font-weight:700;flex-shrink:0; }
.phone { position:relative;z-index:2; }
.phone .phone-img { width:380px;box-shadow:0 0 80px rgba(34,197,94,0.08),0 30px 100px rgba(0,0,0,0.5); }
</style></head><body>
<div class="slide s6">
  <div class="bg"></div>
  <div class="slide-num">6 / 7</div>
  <div class="text">
    <div class="result-badge">AI Result</div>
    <div class="feature-title">Detailed<br>Diagnosis</div>
    <div class="feature-desc">Get a complete breakdown with confidence scores and actionable next steps.</div>
    <div class="results-list">
      <div class="result-item"><span class="check">✓</span>Part identified with 85% confidence</div>
      <div class="result-item"><span class="check">✓</span>Severity level & urgency assessment</div>
      <div class="result-item"><span class="check">✓</span>Ranked list of likely issues</div>
      <div class="result-item"><span class="check">✓</span>Tools needed & step-by-step fixes</div>
      <div class="result-item"><span class="check">✓</span>When to consult a mechanic</div>
    </div>
  </div>
  <div class="phone"><img class="phone-img" src="result1.png" alt=""></div>
</div></body></html>
