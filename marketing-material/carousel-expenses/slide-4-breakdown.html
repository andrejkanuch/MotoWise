<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 4 — Category Breakdown</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1080px;overflow:hidden; }
.slide { width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a; }
.phone-img { border-radius:36px;border:2px solid rgba(255,255,255,0.06); }
.slide-num { position:absolute;top:36px;right:40px;color:rgba(255,255,255,0.12);font-size:14px;font-weight:600;z-index:10;letter-spacing:1px; }

.s4 { display:flex;align-items:center;padding:60px 56px;gap:44px; }
.bg { position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.07) 0%,transparent 60%);left:-80px;top:50%;transform:translateY(-50%); }
.text { flex:1;z-index:2; }
.step-badge { display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:#22c55e;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px; }
.feature-title { color:#fafafa;font-size:44px;font-weight:800;line-height:1.12;margin-bottom:18px; }
.feature-desc { color:#a3a3a3;font-size:19px;line-height:1.6;margin-bottom:28px; }
.stats { display:flex;flex-direction:column;gap:14px; }
.stat-row { display:flex;align-items:center;gap:16px;padding:16px 24px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px; }
.stat-dot { width:12px;height:12px;border-radius:50%;flex-shrink:0; }
.stat-label { color:#d4d4d4;font-size:17px;font-weight:500;flex:1; }
.stat-value { color:#fafafa;font-size:17px;font-weight:700; }
.phone { position:relative;z-index:2; }
.phone .phone-img { width:380px;box-shadow:0 0 80px rgba(34,197,94,0.08),0 30px 100px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="slide s4">
  <div class="bg"></div>
  <div class="slide-num">4 / 7</div>
  <div class="phone"><img class="phone-img" src="expenses.png" alt=""></div>
  <div class="text">
    <div class="step-badge">Step 2</div>
    <div class="feature-title">See Where<br>It All Goes</div>
    <div class="feature-desc">Color-coded category breakdown shows exactly where your money disappears. No more guessing.</div>
    <div class="stats">
      <div class="stat-row"><div class="stat-dot" style="background:#3b82f6;"></div><div class="stat-label">Fuel</div><div class="stat-value">$1,240</div></div>
      <div class="stat-row"><div class="stat-dot" style="background:#f59e0b;"></div><div class="stat-label">Maintenance</div><div class="stat-value">$856</div></div>
      <div class="stat-row"><div class="stat-dot" style="background:#22c55e;"></div><div class="stat-label">Parts</div><div class="stat-value">$328</div></div>
      <div class="stat-row"><div class="stat-dot" style="background:#8b5cf6;"></div><div class="stat-label">Gear</div><div class="stat-value">$164</div></div>
    </div>
  </div>
</div>
</body>
</html>
