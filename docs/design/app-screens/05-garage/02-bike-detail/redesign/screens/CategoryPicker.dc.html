<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.c{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.06);width:100%;box-sizing:border-box;text-align:left}
.c:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.grp{background:#141210;border:1px solid rgba(255,255,255,0.06);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.55)"></div>
<div style="position:absolute;left:0;right:0;top:120px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="AddExpense.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Back</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">Category</div>
<a href="EditCategory.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#E07A48">New</a>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:6px 16px 0 16px">

<div><label for="cat-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search categories</label><input id="cat-search" type="search" placeholder="Search…" style="width:100%;box-sizing:border-box;height:40px;background:#141210;border:1px solid rgba(255,255,255,0.08);border-radius:11px;padding:0 12px;color:#F3EEE6;font-family:inherit;font-size:14px"></div>

<div style="display:flex;flex-direction:column;gap:6px">
<div class="eyebrow" style="padding:0 2px">Most used on this bike</div>
<div class="grp">
<button class="c" style="background:#2A2017"><span class="dot" style="background:#E8A040"></span><span style="flex:1;font-size:15px;font-weight:600">Fuel</span><span class="mono muted" style="font-size:12px">11 entries</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E07A48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
<button class="c"><span class="dot" style="background:#5B8DEF"></span><span style="flex:1;font-size:15px;font-weight:600">Service</span><span class="mono muted" style="font-size:12px">3</span></button>
<button class="c"><span class="dot" style="background:#3FBF9A"></span><span style="flex:1;font-size:15px;font-weight:600">Parts</span><span class="mono muted" style="font-size:12px">2</span></button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<div class="eyebrow" style="padding:0 2px">Running costs</div>
<div class="grp">
<button class="c"><span class="dot" style="background:#B8B2A8"></span><span style="flex:1;font-size:15px;font-weight:600">Tires</span></button>
<button class="c"><span class="dot" style="background:#8B7CE8"></span><span style="flex:1;font-size:15px;font-weight:600">Insurance</span><span class="muted" style="font-size:12px">asks valid until</span></button>
<button class="c"><span class="dot" style="background:#D4622E"></span><span style="flex:1;font-size:15px;font-weight:600">Gear</span></button>
<button class="c"><span class="dot" style="background:#6F685E"></span><span style="flex:1;font-size:15px;font-weight:600">Registration</span><span class="muted" style="font-size:12px">asks valid until</span></button>
<button class="c"><span class="dot" style="background:#6F685E"></span><span style="flex:1;font-size:15px;font-weight:600">Taxes &amp; fees</span></button>
<button class="c"><span class="dot" style="background:#6F685E"></span><span style="flex:1;font-size:15px;font-weight:600">Tolls</span></button>
<button class="c"><span class="dot" style="background:#6F685E"></span><span style="flex:1;font-size:15px;font-weight:600">Parking</span></button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<div class="eyebrow" style="padding:0 2px">Invested in the bike</div>
<div class="grp">
<button class="c"><span class="dot" style="background:#3FBF9A"></span><span style="flex:1;font-size:15px;font-weight:600">Accessories</span></button>
<button class="c"><span class="dot" style="background:#C9A86A"></span><span style="flex:1;font-size:15px;font-weight:600">Upgrades</span></button>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
