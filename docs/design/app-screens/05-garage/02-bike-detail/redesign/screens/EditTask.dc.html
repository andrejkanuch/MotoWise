<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit task sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%}
input{height:48px}textarea{padding:12px 14px;resize:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.lbl{font-size:13px;font-weight:600;color:#B5ADA2}
.pri{flex:1;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.05em;display:flex;align-items:center;justify-content:center;color:#B5ADA2;background:#141210}
.field{display:flex;flex-direction:column;gap:6px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;padding:54px 8px 0 8px;opacity:0.3;display:flex;flex-direction:column;gap:14px">
<div style="height:48px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">Africa Twin</div>
<div class="serif" style="font-size:32px;padding:0 8px">Brake pads inspection</div>
</div>
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>

<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="TaskDetail.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">Edit task</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:6px 16px 0 16px">

<div class="field"><label class="lbl" for="e-title">Title</label><input id="e-title" type="text" value="Brake pads inspection"></div>

<div class="field"><div class="lbl">Priority</div>
<div style="display:flex;gap:6px">
<button class="pri">LOW</button>
<button class="pri">MED</button>
<button class="pri" style="background:#3A2412;border-color:rgba(240,160,80,0.5);color:#F0A050">HIGH</button>
<button class="pri">CRIT</button>
</div>
</div>

<div class="field"><div class="lbl">Due — whichever comes first</div>
<div style="display:flex;gap:8px">
<div style="flex:1;display:flex;flex-direction:column;gap:4px"><label class="eyebrow" for="e-date" style="font-size:10px">By date</label><input id="e-date" type="text" value="Mar 15, 2026" style="border-color:rgba(255,122,107,0.5)"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:4px"><label class="eyebrow" for="e-km" style="font-size:10px">At odometer</label><div style="position:relative"><input id="e-km" type="text" class="mono" value="42,100"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">km</span></div></div>
</div>
<div style="font-size:12px"><span style="color:#FF7A6B">201 days late by date</span><span class="muted"> · 3,933 km to the odometer target</span></div>
</div>

<div class="field"><div class="lbl">Repeat</div>
<div style="display:flex;gap:8px;align-items:center">
<div style="flex:1;position:relative"><label for="e-rkm" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Repeat every, kilometres</label><input id="e-rkm" type="text" class="mono" value="12,000"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">km</span></div>
<span class="muted" style="font-size:13px">or</span>
<div style="flex:1;position:relative"><label for="e-rmo" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Repeat every, months</label><input id="e-rmo" type="text" class="mono" value="12"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">mo</span></div>
</div>
<div class="muted" style="font-size:12px">From the Honda schedule. Changing it keeps the task; the schedule link is dropped.</div>
</div>

<div class="field"><label class="lbl" for="e-desc">What to do</label><textarea id="e-desc" rows="3">Check pad thickness front and rear, minimum 1.5 mm to the wear indicator. Inspect discs for scoring; measure front disc thickness (min 4.5 mm).</textarea></div>

<div class="field"><label class="lbl" for="e-notes">Notes</label><textarea id="e-notes" rows="2">Front pads were at the limit before the Pyrenees trip last year. Order EBC FA679HH if needed.</textarea></div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:8px">
<button style="width:100%;height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700">Save changes</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
