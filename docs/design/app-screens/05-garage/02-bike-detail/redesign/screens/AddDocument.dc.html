<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add document sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%;height:48px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.lbl{font-size:13px;font-weight:600;color:#B5ADA2}
.field{display:flex;flex-direction:column;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#141210;font-size:13px;font-weight:600;color:#B5ADA2;display:flex;align-items:center;gap:6px;flex:none}
.chip-on{background:#2A2017;border-color:rgba(224,122,72,0.5);color:#F3EEE6}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>
<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="Bike.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">New document</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:6px 16px 0 16px">

<div style="display:flex;gap:8px">
<button style="flex:1;height:96px;border-radius:14px;border:1px dashed rgba(255,255,255,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#B5ADA2;font-size:13px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Photograph it</button>
<button style="flex:1;height:96px;border-radius:14px;border:1px dashed rgba(255,255,255,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#B5ADA2;font-size:13px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Pick a PDF or file</button>
</div>

<div class="field"><div class="lbl">Category</div>
<div style="display:flex;gap:6px;overflow-x:auto">
<button class="chip chip-on">Insurance</button><button class="chip">Registration</button><button class="chip">Inspection · ITV</button><button class="chip">Title</button><button class="chip">Service record</button><button class="chip">Other</button>
</div>
<div class="muted" style="font-size:12px">Insurance, registration and inspection count towards ride status when they expire. <span style="color:#E07A48;font-weight:600">Manage categories</span></div>
</div>

<div class="field"><label class="lbl" for="d-title">Title</label><input id="d-title" type="text" value="Mapfre · third party + theft"></div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="d-exp">Expires</label><input id="d-exp" type="text" value="Oct 14, 2027"></div>
<div class="field" style="flex:1"><label class="lbl" for="d-remind">Warn me</label><button id="d-remind" style="height:48px;border-radius:12px;background:#141210;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;width:100%;box-sizing:border-box"><span>30 days before</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C958A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#141210;border:1px solid rgba(255,255,255,0.06)">
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:14px;font-weight:600">Replaces the current insurance</div><div class="muted" style="font-size:12px">The policy expiring Oct 14 moves to History and its alert clears. Renewal cost? <span style="color:#E07A48;font-weight:600">Log €… as Insurance</span></div></div>
<button role="switch" aria-checked="true" aria-label="Replaces the current insurance" style="width:50px;height:30px;border-radius:15px;background:#D4622E;position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF"></span></button>
</div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06)">
<a href="DocumentDetail.dc.html" style="height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Save document</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
