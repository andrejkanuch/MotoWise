<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark done sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%}
input{height:48px}textarea{padding:12px 14px;resize:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}.ok{color:#5FC8A0}
.lbl{font-size:13px;font-weight:600;color:#B5ADA2}
.field{display:flex;flex-direction:column;gap:6px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;padding:54px 8px 0 8px;opacity:0.3;display:flex;flex-direction:column;gap:14px">
<div style="height:48px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">Africa Twin</div>
<div class="serif" style="font-size:32px;padding:0 8px">Brake pads inspection</div>
</div>
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>

<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="TaskDetail.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">Mark done</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:6px 16px 0 16px">

<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#141210;border:1px solid rgba(255,255,255,0.06)">
<div style="width:36px;height:36px;border-radius:10px;background:#3A2412;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0A050" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:15px;font-weight:600">Brake pads inspection</div><div class="muted" style="font-size:12px">High · was 201 days late</div></div>
</div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="c-date">Done on</label><input id="c-date" type="text" value="Today, Oct 2"></div>
<div class="field" style="flex:1"><label class="lbl" for="c-km">At odometer</label><div style="position:relative"><input id="c-km" type="text" class="mono" value="38,167"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">km</span></div></div>
</div>
<div class="muted" style="font-size:12px;margin-top:-8px">Prefilled from the bike. A higher reading also updates the odometer.</div>

<div class="field"><label class="lbl" for="c-cost">Cost <span class="muted" style="font-weight:500">· optional, logged as a Service expense</span></label><div style="position:relative"><span class="mono muted" style="position:absolute;left:14px;top:14px;font-size:15px">€</span><input id="c-cost" type="text" class="mono" placeholder="0.00" style="padding-left:32px"></div></div>

<div class="field"><label class="lbl" for="c-notes">What was done <span class="muted" style="font-weight:500">· optional</span></label><textarea id="c-notes" rows="2" placeholder="Pads measured 2.8 mm front, 4 mm rear…"></textarea></div>

<div class="field"><div class="lbl">Photos <span class="muted" style="font-weight:500">· receipt, part, odometer</span></div>
<div style="display:flex;gap:8px">
<button aria-label="Take a photo" style="width:72px;height:72px;border-radius:12px;border:1px dashed rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#B5ADA2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#152019;border:1px solid rgba(95,200,160,0.25)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5FC8A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
<div style="flex:1;font-size:13px;line-height:17px"><span style="font-weight:600">Next one lands Oct 2, 2027 or 50,167 km</span><span class="dim"> — repeats every 12 months or 12,000 km.</span></div>
</div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06)">
<button style="width:100%;height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Mark done</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
