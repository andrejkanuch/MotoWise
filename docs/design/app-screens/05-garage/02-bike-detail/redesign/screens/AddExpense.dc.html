<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%}
input{height:48px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.lbl{font-size:13px;font-weight:600;color:#B5ADA2}
.field{display:flex;flex-direction:column;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#141210;font-size:13px;font-weight:600;color:#B5ADA2;display:flex;align-items:center;gap:6px;flex:none}
.chip-on{background:#2A2017;border-color:rgba(224,122,72,0.5);color:#F3EEE6}
.dot{width:8px;height:8px;border-radius:2px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>
<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="Costs.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">New expense</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:6px 16px 0 16px">

<a href="ScanReceipt.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#141210;border:1px solid rgba(255,255,255,0.08)">
<div style="width:40px;height:40px;border-radius:11px;background:#2A2724;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EEE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></div>
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:15px;font-weight:600">Scan the receipt</div><div class="muted" style="font-size:12px">Fills amount, date, shop and a category guess for you to check · 3 free scans left</div></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C958A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</a>
<div class="muted" style="font-size:12px;margin-top:-6px;padding:0 2px">Typing an expense is always free.</div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="x-amt">Amount</label><div style="position:relative"><span class="mono muted" style="position:absolute;left:14px;top:12px;font-size:18px">€</span><input id="x-amt" type="text" class="mono" value="29.74" style="padding-left:34px;font-size:20px"></div></div>
<div class="field" style="flex:1"><label class="lbl" for="x-date">Date</label><input id="x-date" type="text" value="Today, Oct 2"></div>
</div>

<div class="field"><div class="lbl">Category</div>
<div style="display:flex;gap:6px;overflow-x:auto">
<button class="chip chip-on"><span class="dot" style="background:#E8A040"></span>Fuel</button>
<button class="chip"><span class="dot" style="background:#5B8DEF"></span>Service</button>
<button class="chip"><span class="dot" style="background:#3FBF9A"></span>Parts</button>
<button class="chip"><span class="dot" style="background:#B8B2A8"></span>Tires</button>
<button class="chip"><span class="dot" style="background:#8B7CE8"></span>Insurance</button>
<a href="CategoryPicker.dc.html" class="chip">More · 9</a>
</div>
<div class="muted" style="font-size:12px">Your most-used first. Fuel asks for litres so it can show consumption.</div>
</div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="x-item">Item <span class="muted" style="font-weight:500">· optional</span></label><input id="x-item" type="text" placeholder="Sin plomo 98"></div>
<div class="field" style="width:110px"><label class="lbl" for="x-l">Litres</label><div style="position:relative"><input id="x-l" type="text" class="mono" placeholder="—"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">L</span></div></div>
</div>

<div class="field"><label class="lbl" for="x-odo">Odometer <span class="muted" style="font-weight:500">· prefilled, edit if the receipt is older</span></label><div style="position:relative"><input id="x-odo" type="text" class="mono" value="38,167"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">km</span></div></div>

<div style="display:flex;gap:8px">
<a href="LinkJob.dc.html" style="flex:1;height:44px;border-radius:12px;background:#141210;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;box-sizing:border-box"><span class="dim">Link to a service job</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C958A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a>
<button aria-label="Add receipt photo" style="width:44px;height:44px;border-radius:12px;border:1px dashed rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#B5ADA2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
</div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06)">
<a href="CostsScrolled.dc.html" style="height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Save expense</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
