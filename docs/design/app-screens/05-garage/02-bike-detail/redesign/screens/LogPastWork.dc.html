<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log past work sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%}
input{height:48px}textarea{padding:12px 14px;resize:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.lbl{font-size:13px;font-weight:600;color:#B5ADA2}
.field{display:flex;flex-direction:column;gap:6px}
.pick{height:48px;border-radius:12px;background:#141210;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;width:100%;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>
<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="ServiceHistory.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">Log past work</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:6px 16px 0 16px">

<div style="display:flex;gap:2px;padding:2px;border-radius:11px;background:#141210;border:1px solid rgba(255,255,255,0.06)">
<a href="AddTask.dc.html" style="flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:#B5ADA2;display:flex;align-items:center;justify-content:center">Plan a task</a>
<a href="LogPastWork.dc.html" style="flex:1;height:32px;border-radius:9px;background:#2A2724;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">Log past work</a>
</div>

<div class="field"><label class="lbl" for="p-title">What was done</label><input id="p-title" type="text" value="Running-in service, 1,000 km"></div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="p-date">Date</label><input id="p-date" type="text" value="Jul 30, 2022"></div>
<div class="field" style="flex:1"><label class="lbl" for="p-km">Odometer then</label><div style="position:relative"><input id="p-km" type="text" class="mono" value="1,020"><span class="mono muted" style="position:absolute;right:14px;top:14px;font-size:14px">km</span></div></div>
</div>

<div class="field"><div class="lbl">Done by</div>
<div style="display:flex;gap:6px">
<button style="flex:1;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);font-size:13px;font-weight:600;color:#B5ADA2;background:#141210">Me</button>
<button style="flex:2;height:40px;border-radius:10px;border:1px solid rgba(224,122,72,0.5);font-size:13px;font-weight:600;background:#2A2017;color:#F3EEE6">Shop · Motos Ebro</button>
</div>
</div>

<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label class="lbl" for="p-cost">Cost</label><div style="position:relative"><span class="mono muted" style="position:absolute;left:14px;top:14px;font-size:15px">€</span><input id="p-cost" type="text" class="mono" value="189.00" style="padding-left:32px"></div></div>
<div class="field" style="flex:1"><div class="lbl">Logged as</div><button class="pick"><span>Service</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C958A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
</div>
<div class="muted" style="font-size:12px;margin-top:-6px">Already logged the invoice? <span style="color:#E07A48;font-weight:600">Link an existing expense</span> instead of adding a cost.</div>

<div class="field"><label class="lbl" for="p-notes">Notes <span class="muted" style="font-weight:500">· parts, what the shop said</span></label><textarea id="p-notes" rows="2" placeholder="Oil 10W-30 MA2, filter 15410-MFJ-D02, clutch adjusted…"></textarea></div>

<div class="field"><div class="lbl">Photos · invoice, parts</div>
<div style="display:flex;gap:8px"><button aria-label="Take a photo" style="width:72px;height:72px;border-radius:12px;border:1px dashed rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#B5ADA2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button></div>
</div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06)">
<a href="ServiceHistory.dc.html" style="height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Add to history</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
