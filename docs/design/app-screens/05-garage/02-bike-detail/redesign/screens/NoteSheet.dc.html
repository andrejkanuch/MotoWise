<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New note sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141210;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F3EEE6}
a{color:#F3EEE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
textarea{font-family:inherit;color:#F3EEE6;background:#141210;border:1px solid rgba(255,255,255,0.1);border-radius:14px;font-size:16px;line-height:23px;padding:14px;box-sizing:border-box;width:100%;resize:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#9C958A}
.muted{color:#9C958A}.dim{color:#B5ADA2}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#141210;font-size:13px;font-weight:600;color:#B5ADA2;display:flex;align-items:center;gap:6px;flex:none}
.chip-on{background:#2A2017;border-color:rgba(224,122,72,0.5);color:#F3EEE6}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#141210">
<div style="position:absolute;inset:0;background:rgba(10,9,8,0.5)"></div>
<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:#1E1C19;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.08)">
<div style="display:flex;align-items:center;padding:14px 8px 6px 8px">
<a href="Notes.dc.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#B5ADA2">Cancel</a>
<div class="serif" style="flex:1;text-align:center;font-size:24px">New note</div>
<div style="width:72px"></div>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:6px 16px 0 16px">

<label for="n-text" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Note</label>
<textarea id="n-text" rows="6">Rear preload felt soft two-up on the Pyrenees run — check sag before the next trip. Manual says 3 clicks from max for luggage + pillion.</textarea>

<div style="display:flex;gap:6px;overflow-x:auto">
<button class="chip chip-on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>38,167 km · today</button>
<button class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Photo</button>
<a href="LinkJob.dc.html" class="chip">Link a job or expense</a>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<div class="eyebrow" style="padding:0 2px">Attach to</div>
<div style="display:flex;gap:6px">
<button class="chip chip-on">Africa Twin</button><button class="chip">“The Cub”</button><button class="chip">R 1200 GS</button>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:#141210;border:1px solid rgba(255,255,255,0.06)">
<div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:14px;font-weight:600">Also make it a task</div><div class="muted" style="font-size:12px">Creates “Check rear sag” · Low · no due date, with this note attached</div></div>
<button role="switch" aria-checked="false" aria-label="Also make it a task" style="width:50px;height:30px;border-radius:15px;background:#4A4640;position:relative;flex:none"><span style="position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#F3EEE6"></span></button>
</div>

<div class="muted" style="font-size:12px;line-height:16px;padding:0 2px">Part numbers, pressures and phone numbers are recognised and become tappable in the note.</div>

</div>

<div style="padding:12px 16px 34px 16px;border-top:1px solid rgba(255,255,255,0.06)">
<a href="Notes.dc.html" style="height:52px;border-radius:14px;background:#D4622E;color:#1A1410;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Save note</a>
</div>
</div>
</div>
</x-dc>

  renderVals() { return {}; }
}
</script>
</body>
</html>
