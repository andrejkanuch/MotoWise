services:
  - type: web
    name: MotoWise
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/types/**
        - packages/tsconfig/**
        - pnpm-lock.yaml
        - turbo.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Cap V8's old-space below the Starter container ceiling (512MB) so the
      # heap is reclaimed by GC instead of the process being OOM-killed at the
      # limit. An OOM kill restarts the (single) instance — a ~45s full outage
      # with no redundancy (Sentry MOTOVAULT-WEB-N + mobile 504/abort). 384MB
      # leaves headroom for non-heap RSS (buffers, native, stacks).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      # AI model-insights (onboarding Reveal known-issues card). Non-secret
      # config: Gemini is primary (key lives in motovault-secrets), OpenAI is
      # the fallback. Timeout fits the onboarding building-plan 2.5s cap.
      - key: AI_INSIGHTS_ENABLED
        value: "true"
      - key: AI_INSIGHTS_TIMEOUT_MS
        value: "2000"
      - fromGroup: motovault-secrets

envVarGroups:
  - name: motovault-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Gemini API key for AI model-insights (primary provider; OpenAI is fallback).
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      # MOT-278: shared secret for the maintenance-due push trigger endpoint; must
      # match the Supabase Vault secret `maintenance_push_secret`. The endpoint fails
      # closed when unset. Value is set in the Render dashboard (sync: false).
      - key: MAINTENANCE_PUSH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
