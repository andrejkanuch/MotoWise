<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
  }
  .phone-img {
    border-radius: 36px;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .slide-num {
    position: absolute;
    top: 36px;
    right: 40px;
    color: rgba(255,255,255,0.12);
    font-size: 14px;
    font-weight: 600;
    z-index: 10;
    letter-spacing: 1px;
  }
</style>

<style>
  .slide-3 {
    display: flex;
    align-items: center;
    padding: 60px 56px;
    gap: 44px;
  }
  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,197,94,0.07) 0%, transparent 60%);
    right: -80px;
    top: 50%;
    transform: translateY(-50%);
  }
  .text-side { flex: 1; z-index: 2; }
  .feature-badge {
    color: #22c55e;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
  .feature-title {
    color: #fafafa;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.12;
    margin-bottom: 18px;
  }
  .feature-desc {
    color: #a3a3a3;
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .bullets { display: flex; flex-direction: column; gap: 14px; }
  .bullet {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #d4d4d4;
    font-size: 17px;
    font-weight: 500;
  }
  .check {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(34,197,94,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #22c55e;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .phone-side { position: relative; z-index: 2; }
  .phone-side .phone-img {
    width: 380px;
    box-shadow: 0 0 80px rgba(34,197,94,0.08), 0 30px 100px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="slide slide-3">
  <div class="bg-glow"></div>
  <div class="slide-num">3 / 7</div>
  <div class="text-side">
    <div class="feature-badge"><span class="dot"></span> Smart Tracking</div>
    <div class="feature-title">Every Task,<br>Organized</div>
    <div class="feature-desc">Track active maintenance tasks with priority levels and mileage-based triggers.</div>
    <div class="bullets">
      <div class="bullet"><span class="check">✓</span> Priority levels — High, Medium, Low</div>
      <div class="bullet"><span class="check">✓</span> Due dates & mileage tracking</div>
      <div class="bullet"><span class="check">✓</span> Full service history log</div>
      <div class="bullet"><span class="check">✓</span> Mark done with one tap</div>
    </div>
  </div>
  <div class="phone-side">
    <img class="phone-img" src="maintenance.png" alt="">
  </div>
</div>
</body>
</html>
