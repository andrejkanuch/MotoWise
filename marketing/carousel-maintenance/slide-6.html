<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
  }
  .phone-img {
    border-radius: 36px;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .slide-num {
    position: absolute;
    top: 36px;
    right: 40px;
    color: rgba(255,255,255,0.12);
    font-size: 14px;
    font-weight: 600;
    z-index: 10;
    letter-spacing: 1px;
  }
</style>

<style>
  .slide-6 {
    display: flex;
    align-items: center;
    padding: 60px 56px;
    gap: 44px;
  }
  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 60%);
    right: -80px;
    top: 50%;
    transform: translateY(-50%);
  }
  .text-side { flex: 1; z-index: 2; }
  .feature-badge {
    color: #f59e0b;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; }
  .feature-title {
    color: #fafafa;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.12;
    margin-bottom: 18px;
  }
  .feature-desc {
    color: #a3a3a3;
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .stat-cards { display: flex; gap: 16px; }
  .stat-card {
    flex: 1;
    background: rgba(245,158,11,0.05);
    border: 1px solid rgba(245,158,11,0.12);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
  }
  .stat-value { color: #fafafa; font-size: 30px; font-weight: 800; }
  .stat-label { color: #a3a3a3; font-size: 13px; font-weight: 500; margin-top: 4px; }
  .phone-side { position: relative; z-index: 2; }
  .phone-side .phone-img {
    width: 380px;
    box-shadow: 0 0 80px rgba(245,158,11,0.08), 0 30px 100px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="slide slide-6">
  <div class="bg-glow"></div>
  <div class="slide-num">6 / 7</div>
  <div class="text-side">
    <div class="feature-badge"><span class="dot"></span> Expense Tracking</div>
    <div class="feature-title">Know Where<br>Every Dollar<br>Goes</div>
    <div class="feature-desc">Automatic cost breakdowns by category. See your true cost of ownership.</div>
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-value">$0.19</div>
        <div class="stat-label">Per Kilometer</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">$216</div>
        <div class="stat-label">Avg / Month</div>
      </div>
    </div>
  </div>
  <div class="phone-side">
    <img class="phone-img" src="expenses.png" alt="">
  </div>
</div>
</body>
</html>
