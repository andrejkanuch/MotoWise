<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  * { margin:0;padding:0;box-sizing:border-box; }
  body { font-family:'Plus Jakarta Sans',sans-serif;width:1024px;height:500px;overflow:hidden;position:relative; }
  .slide {
    width:1024px;height:500px;position:relative;overflow:hidden;
    background: linear-gradient(135deg, #050508 0%, #0a0f1a 40%, #0d1520 100%);
  }
  /* Glows */
  .glow1 {
    position:absolute;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(212,98,46,0.15) 0%,rgba(212,98,46,0.03) 40%,transparent 65%);
    top:-200px;left:-100px;
  }
  .glow2 {
    position:absolute;width:500px;height:500px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,197,94,0.10) 0%,transparent 60%);
    bottom:-150px;right:100px;
  }
  .glow3 {
    position:absolute;width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(59,130,246,0.06) 0%,transparent 60%);
    top:50%;right:-50px;transform:translateY(-50%);
  }
  /* Subtle grid pattern */
  .grid-pattern {
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Content */
  .content {
    position:relative;z-index:2;
    display:flex;align-items:center;
    height:100%;padding:0 70px;gap:50px;
  }
  .text-side {
    flex:1;
  }
  .logo-row {
    display:flex;align-items:center;gap:12px;margin-bottom:24px;
  }
  .logo-img {
    width:44px;height:44px;border-radius:12px;object-fit:cover;
  }
  .logo-name {
    color:#fafafa;font-size:22px;font-weight:700;letter-spacing:-0.5px;
  }
  .headline {
    color:#fafafa;font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;margin-bottom:16px;
  }
  .headline .accent-orange {
    background:linear-gradient(135deg,#D4622E,#E8723A);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .headline .accent-green {
    background:linear-gradient(135deg,#22c55e,#3cb88c);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .tagline {
    color:#a3a3a3;font-size:16px;font-weight:400;line-height:1.5;max-width:380px;
  }
  .pills {
    display:flex;gap:10px;margin-top:20px;
  }
  .pill {
    padding:6px 16px;border-radius:100px;font-size:12px;font-weight:600;
    letter-spacing:0.5px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    color:#a3a3a3;
  }
  .pill.green { border-color:rgba(34,197,94,0.25);color:#22c55e;background:rgba(34,197,94,0.06); }
  .pill.orange { border-color:rgba(212,98,46,0.25);color:#D4622E;background:rgba(212,98,46,0.06); }
  .pill.blue { border-color:rgba(59,130,246,0.25);color:#3b82f6;background:rgba(59,130,246,0.06); }
  
  /* Phone mockups */
  .phones {
    position:relative;display:flex;gap:16px;align-items:flex-end;
  }
  .phone {
    border-radius:24px;border:2px solid rgba(255,255,255,0.06);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .phone-main {
    width:200px;position:relative;z-index:2;
  }
  .phone-secondary {
    width:180px;opacity:0.7;position:relative;z-index:1;
    margin-bottom:20px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="glow3"></div>
  <div class="grid-pattern"></div>
  
  <div class="content">
    <div class="text-side">
      <div class="logo-row">
        <img class="logo-img" src="logo.png" alt="">
        <span class="logo-name">MotoVault</span>
      </div>
      <div class="headline">
        <span class="accent-orange">Learn.</span> <span class="accent-green">Track.</span><br>
        Ride Smarter.
      </div>
      <div class="tagline">AI-powered motorcycle learning, photo diagnostics, and maintenance tracking — personalized to your ride.</div>
      <div class="pills">
        <span class="pill blue">AI Diagnostics</span>
        <span class="pill green">Maintenance</span>
        <span class="pill orange">50+ Lessons</span>
      </div>
    </div>
    <div class="phones">
      <img class="phone phone-secondary" src="diagnose.png" alt="">
      <img class="phone phone-main" src="home.png" alt="">
    </div>
  </div>
</div>
</body>
</html>
