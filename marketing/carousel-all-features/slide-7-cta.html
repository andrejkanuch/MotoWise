<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif;width:1080px;height:1350px;overflow:hidden; }
.slide { width:1080px;height:1350px;position:relative;overflow:hidden;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center; }
.bg { position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(212,98,46,0.1) 0%,transparent 50%),radial-gradient(circle at 70% 65%,rgba(59,130,246,0.07) 0%,transparent 50%),radial-gradient(circle at 50% 100%,rgba(139,92,246,0.05) 0%,transparent 40%); }
.slide-num { position:absolute;top:32px;right:38px;color:rgba(255,255,255,0.12);font-size:14px;font-weight:700;z-index:10;letter-spacing:1px; }

.logo-big { position:relative;z-index:2;width:88px;height:88px;border-radius:24px;object-fit:cover;margin-bottom:30px;box-shadow:0 12px 48px rgba(0,0,0,0.5); }
.cta-title { position:relative;z-index:2;color:#fafafa;font-size:58px;font-weight:800;text-align:center;line-height:1.1;margin-bottom:16px;max-width:720px; }
.cta-title span { background:linear-gradient(135deg,#D4622E,#E8723A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.cta-sub { position:relative;z-index:2;color:#a3a3a3;font-size:21px;text-align:center;margin-bottom:44px;line-height:1.5;max-width:500px; }

.stores { position:relative;z-index:2;display:flex;gap:20px;align-items:center;margin-bottom:20px; }
.store-badge { display:flex;align-items:center;gap:9px;padding:11px 26px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#d4d4d4;font-size:15px;font-weight:600; }

.cta-btn { position:relative;z-index:2;background:linear-gradient(135deg,#D4622E,#E8723A);color:#fff;font-size:22px;font-weight:700;padding:20px 70px;border-radius:100px;border:none;box-shadow:0 12px 48px rgba(212,98,46,0.32);margin-bottom:20px; }
.free-note { position:relative;z-index:2;color:#22c55e;font-size:16px;font-weight:600; }
.brand-bottom { position:absolute;bottom:40px;z-index:2;color:#3a3a3a;font-size:16px;font-weight:600; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg"></div>
  <div class="slide-num">7 / 7</div>
  <img class="logo-big" src="../MotoVault-logo.png" alt="MotoVault">
  <div class="cta-title">Your Bike.<br>Your <span>Command Center.</span></div>
  <div class="cta-sub">Routes, maintenance, diagnostics & more — all free to download.</div>
  <div class="stores">
    <div class="store-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      App Store
    </div>
    <div class="store-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Google Play
    </div>
  </div>
  <div class="cta-btn">Download Free</div>
  <div class="free-note">✓ Free on iOS & Android</div>
  <div class="brand-bottom">motovault.app</div>
</div>
</body>
</html>
