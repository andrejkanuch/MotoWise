<html lang="en">

<meta charset="UTF-8">

<title>Personal Finance Analysis</title>

<style>
:root {
  --bg: #0f1729;
  --card: #1a2332;
  --card-border: #2a3a50;
  --accent: #4f8ff7;
  --accent2: #7c5cfc;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 40px 20px 20px; }
header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text-dim); margin-top: 8px; font-size: 0.95rem; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 30px 0; }
.kpi { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; text-align: center; transition: transform 0.2s; }
.kpi:hover { transform: translateY(-2px); }
.kpi-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-value { font-size: 1.8rem; font-weight: 700; margin: 6px 0; }
.kpi-delta { font-size: 0.85rem; font-weight: 600; }
.kpi-delta.up { color: var(--green); }
.kpi-delta.down { color: var(--red); }
.kpi-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

.section { margin: 40px 0; }
.section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
.section-title .icon { font-size: 1.5rem; }
.section-desc { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.chart-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { font-size: 1rem; margin-bottom: 14px; color: var(--text-dim); }
.chart-container { position: relative; height: 300px; }

.insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.insight { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; }
.insight.warn { border-left: 4px solid var(--yellow); }
.insight.good { border-left: 4px solid var(--green); }
.insight.info { border-left: 4px solid var(--accent); }
.insight.risk { border-left: 4px solid var(--red); }
.insight h4 { font-size: 0.95rem; margin-bottom: 6px; }
.insight p { font-size: 0.85rem; color: var(--text-dim); }

.goal-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
.goal-card h4 { margin-bottom: 10px; }
.progress-bar { background: #1e293b; border-radius: 8px; height: 12px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; border-radius: 8px; transition: width 0.5s; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

.table-wrap { overflow-x: auto; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { background: #1e293b; color: var(--text-dim); padding: 10px 12px; text-align: right; font-weight: 600; position: sticky; top: 0; }
th:first-child { text-align: left; }
td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--card-border); }
td:first-child { text-align: left; font-weight: 500; }
tr:hover td { background: rgba(79,143,247,0.05); }
.pos { color: var(--green); }
.neg { color: var(--red); }

.projection-table { margin-top: 16px; }
.projection-table td, .projection-table th { font-size: 0.85rem; }

@media (max-width: 900px) {
  .chart-grid, .insight-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .kpi-value { font-size: 1.4rem; }
}
</style>
</head>

  const xs = ys.map((_,i) => i);

  const intercept = ym - slope*xm;
  return {slope, intercept, predict: x => intercept + slope*x};
