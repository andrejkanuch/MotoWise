# Full onboarding E2E (INVESTED variant — the superset that visits every screen).
#
# Optional env: KEEP_LANDING_SHEET="true" leaves a landing sheet over Home (see the end).
# Optional env: NO_BIKE="true" skips bike setup ("I'll add my bike later"), so the
# user finishes onboarding with an empty garage. Unset (the default) adds a Honda
# Africa Twin, which every bike flow composed on this one relies on.
#
# Prereqs (handled by scripts/run-onboarding-e2e.sh):
#   - A confirmed Supabase user exists; its creds are passed in as TEST_EMAIL / TEST_PASSWORD.
#   - The app is built/served with EXPO_PUBLIC_OB_VARIANT=invested so the flow is deterministic.
#   - APP_ID defaults to com.motovault.app.
#
# The flow signs IN a pre-created user at the account step (prod requires email
# confirmation, so UI sign-up can't complete in a test — we create+confirm the
# user out-of-band and delete it on teardown).
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
- runFlow: _shared/onboarding-to-account.yaml

# 13. Account → sign in the pre-created user
- tapOn: "Already have an account? Sign in"
- tapOn:
    text: "Continue with email"
    optional: true
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# Dismiss the keyboard by tapping the (non-interactive) subtitle — the app's
# custom keyboard controller doesn't support Maestro's hideKeyboard, and the
# keyboard otherwise covers the Sign In button.
- tapOn:
    text: ".*Sign in to access your garage.*"
    optional: true
- tapOn: "Sign In"
# iOS "Save Password?" system dialog appears after a successful login — decline it.
- tapOn:
    text: "Not Now"
    optional: true

# 14-16. After auth the app either walks heard-about -> notifications ->
# personalizing, or fast-forwards straight to Home (timing/server dependent).
# Handle the optional tail only if it appears; the single hard success check is
# reaching the Home dashboard.
- extendedWaitUntil:
    # One selector per wait: the Home tab label stands in for Home here (the
    # tab's a11y text may carry a badge suffix, hence the optional tail); the
    # final success check below matches Home by its testID.
    visible: "[×✕]|.*hear about us.*|Home(,.*)?"
    timeout: 90000
# commit_first: close the native RevenueCat paywall shown after account.
- tapOn:
    text: "[×✕]"
    optional: true
- runFlow:
    when:
      visible: ".*hear about us.*"
    commands:
      - tapOn: "Instagram"
      - extendedWaitUntil:
          visible: "Enable Notifications"
          timeout: 30000
      - tapOn: "Maybe later"
      # Onboarding receipt-scan step (added by the receipt-scan epic) sits between
      # notifications and personalizing. It's skippable — dismiss it if it shows.
      - tapOn:
          text: "Maybe later"
          optional: true
      - tapOn:
          text: "Open my garage"
          optional: true
      # garage_first: close the paywall presented by "Open my garage".
      - tapOn:
          text: "[×✕]"
          optional: true

# What's New never auto-shows in a session that went through onboarding or
# sign-in. flows/whats-new.yaml covers What's New.

# Success: onboarding complete -> Home dashboard.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 120000

# Landing sheet (issue 365 T16b, D11): a rider whose bike has an open recall or
# an imported service plan gets ONE sheet over Home just after landing. Close it
# so every flow composed on this one starts from a bare Home.
# post-onboarding-landing.yaml sets KEEP_LANDING_SHEET="true" to inspect it.
- runFlow:
    when:
      true: ${typeof KEEP_LANDING_SHEET === 'undefined' || KEEP_LANDING_SHEET !== 'true'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "recall-sheet|oem-imported-sheet"
          timeout: 6000
          optional: true
      - tapOn:
          id: "service-plan-ready-dismiss"
          optional: true
      - runFlow:
          when:
            visible:
              id: "recall-sheet"
          commands:
            - tapOn: "Go back"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 10000
