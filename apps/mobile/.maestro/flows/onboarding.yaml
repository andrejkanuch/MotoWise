# Full onboarding E2E (INVESTED variant — the superset that visits every screen).
#
# Prereqs (handled by scripts/run-onboarding-e2e.sh):
#   - A confirmed Supabase user exists; its creds are passed in as TEST_EMAIL / TEST_PASSWORD.
#   - The app is built/served with EXPO_PUBLIC_OB_VARIANT=invested so the flow is deterministic.
#   - APP_ID defaults to com.motovault.app.
#
# The flow signs IN a pre-created user at the account step (prod requires email
# confirmation, so UI sign-up can't complete in a test — we create+confirm the
# user out-of-band and delete it on teardown).
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# Fresh state so Welcome renders (clears MMKV lastCompletedScreen + any session).
# NOTE: run this against a STANDALONE / PREVIEW build (bundled JS, no Metro) — see
# .maestro/README.md. clearState wipes an Expo dev client's Metro connection, and
# there's no reliable non-interactive way to re-point it, so dev-client runs are not
# supported by this flow.
# clearState resets the sandbox but NOT the iOS Keychain, where expo-secure-store
# persists the Supabase session — a prior session would skip onboarding and make
# this flow flaky. clearKeychain wipes it so Welcome always renders.
- clearState
- clearKeychain
- launchApp

# 1. Welcome
- extendedWaitUntil:
    visible: "Let's get started"
    timeout: 120000
- tapOn: "Let's get started"

# 1b. Analytics consent (block C, #261) — shown where the country rule asks for
# it. Decline so the run sends no analytics.
- extendedWaitUntil:
    visible: ".*How long have you.*|Help shape MotoVault"
    timeout: 15000
- runFlow:
    when:
      visible: "Help shape MotoVault"
    commands:
      - tapOn: "Don't allow"

# 2. Experience (auto-advances after selecting)
- assertVisible: ".*How long have you.*"
- tapOn: ".*Just getting started.*"

# 3–5. Frequency, stay-on-top and last-service screens. The current onboarding
# order goes from Experience straight to Bike setup; these run only if a variant
# still shows them.
- runFlow:
    when:
      visible: ".*Almost daily.*"
    commands:
      - tapOn: ".*Almost daily.*"
- runFlow:
    when:
      visible: ".*Never miss a service.*"
    commands:
      - tapOn: ".*Never miss a service.*"
      - tapOn: "Continue"
- runFlow:
    when:
      visible: ".*Just did it.*"
    commands:
      - tapOn: ".*Just did it.*"
      - tapOn: "Continue"

# 6. Bike setup — MUST add a bike to keep bike-dependent screens reachable.
# Fail-open regression (P2): with no web intent seeded, bike-setup MUST render
# the normal make grid, never the "Is this your ride?" intent confirmation.
- extendedWaitUntil:
    visible: "(?i)Popular makes"
    timeout: 15000
- assertNotVisible: "Is this your ride?"
- tapOn: ".*Honda.*"
# Pick a MODEL too: complete_onboarding only creates the bike when make, model
# and year are all set — a make-only "Add to my garage" leaves the garage empty
# and every bike flow composed on this one fails.
# Tap the model chip directly (no typing — a typed query makes the search
# field's own value match "Africa Twin" too).
- scrollUntilVisible:
    element: "Africa Twin"
    direction: DOWN
    timeout: 20000
- tapOn: "Africa Twin"
- assertVisible: ".*Africa Twin.*"
- tapOn: "Add to my garage"

# 7. Building plan (auto) → 8. Reveal
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# 9. Goals (multi-select → Continue)
- assertVisible: ".*Track my rides.*"
- tapOn: ".*Track my rides.*"
- tapOn: "Continue"

# 10. Maintenance (skip the OEM deck)
- tapOn:
    text: "Skip — I'll set this up later"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# 11. Commitment (commit_first only; skip it)
- tapOn:
    text: "Not now"
    optional: true

# 12. Account screen. The onboarding paywall now comes AFTER account (onboarding
#     paywall A/B, 2026-10-07): commit_first shows it right after account,
#     garage_first on "Open my garage". The signed-in test account is an existing
#     user and is usually routed straight out of onboarding, so both paywall
#     dismissals below are optional.
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 60000

# 13. Account → sign in the pre-created user
- tapOn: "Already have an account? Sign in"
- tapOn:
    text: "Continue with email"
    optional: true
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# Dismiss the keyboard by tapping the (non-interactive) subtitle — the app's
# custom keyboard controller doesn't support Maestro's hideKeyboard, and the
# keyboard otherwise covers the Sign In button.
- tapOn:
    text: ".*Sign in to access your garage.*"
    optional: true
- tapOn: "Sign In"
# iOS "Save Password?" system dialog appears after a successful login — decline it.
- tapOn:
    text: "Not Now"
    optional: true

# 14-16. After auth the app either walks heard-about -> notifications ->
# personalizing, or fast-forwards straight to Home (timing/server dependent).
# Handle the optional tail only if it appears; the single hard success check is
# reaching the Home dashboard.
- extendedWaitUntil:
    # One selector per wait: the Home tab label stands in for Home here (the
    # tab's a11y text may carry a badge suffix, hence the optional tail); the
    # final success check below matches Home by its testID.
    visible: "[×✕]|.*hear about us.*|Home(,.*)?"
    timeout: 90000
# commit_first: close the native RevenueCat paywall shown after account.
- tapOn:
    text: "[×✕]"
    optional: true
- runFlow:
    when:
      visible: ".*hear about us.*"
    commands:
      - tapOn: "Instagram"
      - extendedWaitUntil:
          visible: "Enable Notifications"
          timeout: 30000
      - tapOn: "Maybe later"
      # Onboarding receipt-scan step (added by the receipt-scan epic) sits between
      # notifications and personalizing. It's skippable — dismiss it if it shows.
      - tapOn:
          text: "Maybe later"
          optional: true
      - tapOn:
          text: "Open my garage"
          optional: true
      # garage_first: close the paywall presented by "Open my garage".
      - tapOn:
          text: "[×✕]"
          optional: true

# The signed-in test account is already onboarded, so it can be owed What's New
# for this version (new riders never are). The modal pushes ~500ms after the tabs
# mount: wait briefly for its "What's new · v<version>" label, then tap the Skip
# beside it. Both are optional so a run without the modal passes untouched.
- extendedWaitUntil:
    visible: "What's new · v.*"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "What's new · v.*"
    commands:
      - tapOn:
          text: "Skip"
          rightOf:
            text: "What's new · v.*"

# Success: onboarding complete -> Home dashboard.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 120000
