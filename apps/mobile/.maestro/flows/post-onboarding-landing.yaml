# FS-PO17 guard (issue 365 T16b, owner ruling D11): at most one modal sheet over
# Home in the session the rider lands from onboarding, and none after it closes.
# FS-OB6 guard (issue 365 T16a): "Open my garage" lands once; step 1b.
#
# Order of the landing-sheet queue: safety recall (`recall-sheet`), then
# "Service plan ready" (`oem-imported-sheet`); What's New (`whats-new-sheet`)
# never shows in the landing session. Ids from source: lib/landing-sheet-queue.ts
# (LANDING_SHEET_TEST_ID), the dismiss button `service-plan-ready-dismiss`, and
# the recall sheet's back button ("Go back").
#
# Prereqs: as onboarding.yaml (a LOCAL E2E build with RevenueCat, PostHog and
# Meta keys empty; never a store build or a production OTA). The friction-spec
# repro is a bike with an open recall AND an imported service plan; with the
# default Africa Twin the flow still asserts "at most one" for whatever shows.
# Run: pnpm --filter @motovault/mobile test:e2e:post-onboarding (light, then
# dark appearance; screenshots below are taken in both by the device stage).
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# 1. Onboard and land on Home, keeping the landing sheet on screen. "Open my
# garage" is double-tapped: it must still land once (issue 365 T16a). On a
# build with no paywall the second tap can open Start Ride from Home's Ride FAB;
# onboarding.yaml closes it (the tap reached the new screen, not the CTA).
- runFlow:
    file: onboarding.yaml
    env:
      KEEP_LANDING_SHEET: "true"
      DOUBLE_TAP_GARAGE: "true"

# 1b. FS-OB6 guard (issue 365 T16a): Home within 10 s, and the personalizing
# screen (setup readout, payoff, its CTA or Retry) never shows again, now or
# 5 s later. Guard only: Maestro cannot set the slow-network conditioner of the
# repro; src/__tests__/screens/personalizing.test.tsx covers the CTA states.
# Run once per onboarding paywall arm (garage_first and commit_first builds).
- extendedWaitUntil:
    visible:
      id: "home-screen|recall-sheet|oem-imported-sheet"
    timeout: 10000
- assertNotVisible: ".*Personalizing.*|Setting up your ride.*|Welcome home, rider.*|Open my garage|Retry"
- extendedWaitUntil:
    visible: "FS-OB6 hold: this text never appears"
    timeout: 5000
    optional: true
- assertNotVisible: ".*Personalizing.*|Setting up your ride.*|Welcome home, rider.*|Open my garage|Retry"
- assertVisible:
    id: "home-screen|recall-sheet|oem-imported-sheet"

# 2. Give the queue its show delay, then capture what covers Home.
- extendedWaitUntil:
    visible:
      id: "recall-sheet|oem-imported-sheet|whats-new-sheet"
    timeout: 8000
    optional: true
- takeScreenshot: post-onboarding-landing-sheet

# 3. At most one sheet: none of the others is visible beside the one shown.
# Record which one showed, so step 4 closes only that one.
- evalScript: ${output.landingSheet = 'none'}
- runFlow:
    when:
      visible:
        id: "recall-sheet"
    commands:
      - evalScript: ${output.landingSheet = 'recall'}
      - assertNotVisible:
          id: "oem-imported-sheet"
      - assertNotVisible:
          id: "whats-new-sheet"
- runFlow:
    when:
      visible:
        id: "oem-imported-sheet"
    commands:
      - evalScript: ${output.landingSheet = 'oem_imported'}
      - assertNotVisible:
          id: "recall-sheet"
      - assertNotVisible:
          id: "whats-new-sheet"
# What's New never shows in the landing session.
- assertNotVisible:
    id: "whats-new-sheet"

# 4. Close the sheet that showed, and only that one: a second sheet behind it
# must fail the assertions below, not be closed too.
- runFlow:
    when:
      true: ${output.landingSheet === 'oem_imported'}
    commands:
      - tapOn:
          id: "service-plan-ready-dismiss"
- runFlow:
    when:
      true: ${output.landingSheet === 'recall'}
    commands:
      - tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "recall-sheet|oem-imported-sheet|whats-new-sheet"
    timeout: 8000
    optional: true
- assertNotVisible:
    id: "recall-sheet"
- assertNotVisible:
    id: "oem-imported-sheet"
- assertNotVisible:
    id: "whats-new-sheet"
- takeScreenshot: post-onboarding-landing-home
