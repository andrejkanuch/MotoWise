# Log a ride (start → record → end → save) — E2E for the ride-recording feature.
#
# VALIDATED END-TO-END on-device 2026-07-15 (drove start → record → hold-to-end →
# "End ride?" confirm → "RIDE SAVED" summary → Save ride). The non-obvious bits
# this flow depends on, all confirmed live:
#   - the ride is started from the ride FAB in the tab bar (`id: tab-ride-fab`);
#     the ride UI is addressed by testIDs (#365 T05c, features/ride/ride-test-ids.ts).
#   - `setLocation` gives the sim a GPS fix so the pre-flight GPS check passes;
#     `travel` then moves it ~400 m at 10 m/s (~40 s), so the ride is over both
#     floors (30 s / 50 m). Since issue 365 T09 a ride under 50 m ended from the
#     guard is discarded ("End without saving"), so a standstill ride no longer
#     reaches "RIDE SAVED" (that case is ride-standstill-not-saved.yaml).
#   - the "unfinished ride" banner's End button reads "End Ride" but its a11y
#     label is "End unfinished ride" — match that, not the visible text. "Start
#     ride" is DISABLED until any unfinished ride is resolved.
#   - ENDING IS A LONG-PRESS: the control is "Hold to end ride" (longPressOn), not
#     a tap. A ride over both floors ends straight to the summary; the guard sheet
#     (`id: ride-guard-sheet`) must not open.
#   - the summary shows "RIDE SAVED …" and a "Save ride" button.
#
# Setup: composes onboarding.yaml (signed-in user + Honda). Run via:
#   pnpm --filter @motovault/mobile test:e2e:log-ride
# (preview build + provisioned user, same as the other authed flows).
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# 1. Setup — reach a signed-in Home, and give the sim a GPS fix.
- runFlow: onboarding.yaml
- setLocation:
    latitude: 37.33182
    longitude: -122.03118

# 2. Open the ride start screen via the ride FAB.
- tapOn:
    id: tab-ride-fab
- extendedWaitUntil:
    visible:
      id: start-ride-screen
    timeout: 20000

# 3. Resolve any leftover unfinished ride (its a11y label is "End unfinished ride",
#    not the visible "End Ride"). Start ride is disabled until it's cleared.
- tapOn:
    text: ".*End unfinished ride.*"
    optional: true
- tapOn:
    text: ".*End unfinished ride.*"
    optional: true

# 4. Start the ride and confirm recording.
- tapOn:
    id: start-ride-button
- extendedWaitUntil:
    visible:
      id: ride-hud-root
    timeout: 30000
- extendedWaitUntil:
    visible: "RECORDING"
    timeout: 30000
- takeScreenshot: log-ride-recording

# 5. Ride: ~400 m north at 10 m/s (~40 s), over both floors (30 s / 50 m).
- travel:
    points:
      - "37.33182,-122.03118"
      - "37.33272,-122.03118"
      - "37.33362,-122.03118"
      - "37.33452,-122.03118"
      - "37.33542,-122.03118"
    speed: 10

# 6. End the ride: it's a HOLD, not a tap ("Hold to end ride"). Over the floors,
#    so no guard sheet.
- longPressOn:
    text: ".*Hold to end ride.*"
- assertNotVisible:
    id: ride-guard-sheet

# 7. Success: the ride summary shows "RIDE SAVED …"; finalize with Save ride.
- extendedWaitUntil:
    visible: ".*RIDE SAVED.*"
    timeout: 30000
- assertVisible: ".*RIDE SAVED.*"
- takeScreenshot: log-ride-summary
# The summary is a long ScrollView (map, stats, "About this ride"): Save ride sits
# below the fold, so scroll to it first.
- scrollUntilVisible:
    element:
      text: ".*Save ride.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Save ride.*"
- tapOn:
    text: "Not Now"
    optional: true
