# Shared: fresh install -> onboarding questions -> bike -> the account step
# ("Continue with email" visible). The onboarding paywall comes after account,
# so callers dismiss it. Used by onboarding.yaml (signs in a confirmed user) and
# onboarding-email-code-signup.yaml (signs up a new one). Honours NO_BIKE (see
# onboarding.yaml) and the bike choices below (pass them via `runFlow: env:`):
#   BIKE_MAKE + BIKE_MODEL (+ BIKE_YEAR) — that model instead of the default
#     Honda Africa Twin (onboarding-service-plan.yaml: Yamaha MT-09 2019);
#   MAKE_ONLY="true" — "Not sure of the details?" then the Honda make chip: a
#     make-only bike (onboarding-make-only-service-plan.yaml).
# Lives in _shared/ so the flows/*.yaml glob does not run it on its own.
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# Fresh state so Welcome renders (clears MMKV lastCompletedScreen + any session).
# NOTE: run this against a STANDALONE / PREVIEW build (bundled JS, no Metro) — see
# .maestro/README.md. clearState wipes an Expo dev client's Metro connection, and
# there's no reliable non-interactive way to re-point it, so dev-client runs are not
# supported by this flow.
# clearState resets the sandbox but NOT the iOS Keychain, where expo-secure-store
# persists the Supabase session — a prior session would skip onboarding and make
# this flow flaky. clearKeychain wipes it so Welcome always renders.
- clearState
- clearKeychain
- launchApp

# 0. iOS App Tracking Transparency prompt. A fresh simulator asks on first
# launch and the alert covers Welcome; decline it when it shows.
- extendedWaitUntil:
    visible: "Ask App Not to Track"
    timeout: 15000
    optional: true
- tapOn:
    text: "Ask App Not to Track"
    optional: true

# 1. Welcome
- extendedWaitUntil:
    visible: "Let's get started"
    timeout: 120000
- tapOn: "Let's get started"

# 1b. Analytics consent (block C, #261) — shown where the country rule asks for
# it. Decline so the run sends no analytics.
- extendedWaitUntil:
    visible: ".*How long have you.*|Help shape MotoVault"
    timeout: 15000
- runFlow:
    when:
      visible: "Help shape MotoVault"
    commands:
      - tapOn: "Don't allow"

# 2. Experience (auto-advances after selecting)
- assertVisible: ".*How long have you.*"
- tapOn: ".*Just getting started.*"

# 3–5. Frequency, stay-on-top and last-service screens. The current onboarding
# order goes from Experience straight to Bike setup; these run only if a variant
# still shows them.
- runFlow:
    when:
      visible: ".*Almost daily.*"
    commands:
      - tapOn: ".*Almost daily.*"
- runFlow:
    when:
      visible: ".*Never miss a service.*"
    commands:
      - tapOn: ".*Never miss a service.*"
      - tapOn: "Continue"
- runFlow:
    when:
      visible: ".*Just did it.*"
    commands:
      - tapOn: ".*Just did it.*"
      - tapOn: "Continue"

# 6. Bike setup. Fail-open regression (P2): with no web intent seeded,
# bike-setup MUST render the normal make grid, never the "Is this your ride?"
# intent confirmation.
- extendedWaitUntil:
    visible: "(?i)Popular makes"
    timeout: 15000
- assertNotVisible: "Is this your ride?"

# 6a. Default path: add a bike, which keeps the bike-dependent screens reachable
# and leaves a Honda Africa Twin in the garage for every flow composed on this
# one. A make-only bike is created too since migration 00191 (2026-10-15), but
# the bike flows assert on the model, so the default picks one (6c covers the
# make-only path).
# Tap the model chip directly (no typing — a typed query makes the search
# field's own value match "Africa Twin" too).
# 7. Building plan (auto) → 8. Reveal.
- runFlow:
    when:
      true: ${(typeof NO_BIKE === 'undefined' || NO_BIKE !== 'true') && (typeof MAKE_ONLY === 'undefined' || MAKE_ONLY !== 'true') && typeof BIKE_MODEL === 'undefined'}
    commands:
      - tapOn: ".*Honda.*"
      - scrollUntilVisible:
          element: "Africa Twin"
          direction: DOWN
          timeout: 20000
      - tapOn: "Africa Twin"
      - assertVisible: ".*Africa Twin.*"
      - tapOn: "Add to my garage"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 30000
      - tapOn: "Continue"

# 6a'. BIKE_MAKE + BIKE_MODEL: that make and model, in BIKE_YEAR when given.
# The year stepper appears once the make is picked; it starts three years back,
# so "Previous year" steps down until the year shows. It sits below the model
# list at the bottom edge, and the list reloads on every step (pushing the
# stepper under the footer), so each pass scrolls it to the centre before
# checking. Android reads the year as "Year, 2019", iOS as "2019". The model
# list is fetched for the year, so the model is picked after it. The list shows
# only six models until a query is typed, so the model is typed into the search
# field and its row tapped below the field (the field's own text matches the
# model name too).
- runFlow:
    when:
      true: ${(typeof NO_BIKE === 'undefined' || NO_BIKE !== 'true') && (typeof MAKE_ONLY === 'undefined' || MAKE_ONLY !== 'true') && typeof BIKE_MODEL !== 'undefined'}
    commands:
      # Whole-label match: Maestro text matching ignores case, and the search
      # placeholder ("e.g. 'Yamaha MT-07'") sits above the tiles, so
      # ".*Yamaha.*" tapped the search field instead of the YAMAHA tile.
      - tapOn: "${BIKE_MAKE}"
      - runFlow:
          when:
            true: ${typeof BIKE_YEAR !== 'undefined'}
          commands:
            - repeat:
                times: 15
                commands:
                  - scrollUntilVisible:
                      element: "Previous year"
                      direction: DOWN
                      centerElement: true
                      timeout: 15000
                  - runFlow:
                      when:
                        notVisible: "(Year, )?${BIKE_YEAR}"
                      commands:
                        - tapOn: "Previous year"
            - scrollUntilVisible:
                element: "Previous year"
                direction: DOWN
                centerElement: true
                timeout: 15000
            - assertVisible: "(Year, )?${BIKE_YEAR}"
      - scrollUntilVisible:
          element: "Search ${BIKE_MAKE} models.*"
          direction: UP
          timeout: 15000
      - tapOn: "Search ${BIKE_MAKE} models.*"
      - inputText: "${BIKE_MODEL}"
      - tapOn:
          text: "${BIKE_MODEL}"
          below: "Search ${BIKE_MAKE} models.*"
      - assertVisible: "Change model"
      - assertVisible: ".*${BIKE_MODEL}.*"
      - tapOn: "Add to my garage"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 30000
      - tapOn: "Continue"

# 6c. MAKE_ONLY=true: "Not sure of the details?" reveals the make chips under
# the partial-capture helper; the Honda chip creates a make-only bike (no model)
# and advances. The grid above has a Honda tile too, so the chip is targeted
# below the helper text.
- runFlow:
    when:
      true: ${(typeof NO_BIKE === 'undefined' || NO_BIKE !== 'true') && typeof MAKE_ONLY !== 'undefined' && MAKE_ONLY === 'true'}
    commands:
      - tapOn: "Not sure of the details?"
      - extendedWaitUntil:
          visible: "Just your make is enough.*"
          timeout: 15000
      - tapOn:
          text: "Honda"
          below: "Just your make is enough.*"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 30000
      - tapOn: "Continue"

# 6b. NO_BIKE=true (pass it via `runFlow: env:`): skip the bike, so the account
# ends onboarding with an empty garage (add-bike.yaml needs that — a free user
# with a bike hits the MAX_BIKES paywall). "Not sure of the details?" reveals
# the partial-capture chips with the true skip, "I'll add my bike later"; the
# flow then routes around Reveal to the no-bike value screen.
- runFlow:
    when:
      true: ${typeof NO_BIKE !== 'undefined' && NO_BIKE === 'true'}
    commands:
      - tapOn: "Not sure of the details?"
      - tapOn: "I'll add my bike later"
      - extendedWaitUntil:
          visible: "Add my bike now" # the no-bike value screen's secondary action
          timeout: 30000
      - tapOn: "Continue"

# 9. Goals (multi-select → Continue)
- assertVisible: ".*Track my rides.*"
- tapOn: ".*Track my rides.*"
- tapOn: "Continue"

# 10. Maintenance (skip the OEM deck)
- tapOn:
    text: "Skip — I'll set this up later"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# 11. Commitment (commit_first only; skip it)
- tapOn:
    text: "Not now"
    optional: true

# 12. Account screen. The onboarding paywall now comes AFTER account (onboarding
#     paywall A/B, 2026-10-07): commit_first shows it right after account,
#     garage_first on "Open my garage". The signed-in test account is an existing
#     user and is usually routed straight out of onboarding, so both paywall
#     dismissals below are optional.
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 60000
