# Expense detail → linked Service record (complete task with cost, open expense).
#
# WHY: expense-detail shows a Service record card when maintenanceTaskId resolves.
# complete-maintenance-task.yaml proves completion but never opens the expense.
# This flow chains: create task → complete with cost → open linked expense →
# assert Service record → View full service record → bike-tasks Completed.
#
# Run via:
#   pnpm --filter @motovault/mobile test:e2e:expense-service-record
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
  TASK_TITLE: "E2E Service Record Link"
  ODOMETER: "12600"
  COST: "88.00"
---
- runFlow: onboarding.yaml

- tapOn:
    text: "Garage(,.*)?" # the tab; ".*Garage.*" also matched Home's "Today in your garage." (Maestro text matching ignores case)
- tapOn:
    text: ".*Honda.*"
- extendedWaitUntil:
    visible: "Overview" # the bike hub's first segment — the header and segment bar are up
    timeout: 20000

# Create task — tasks live on the Service segment, whose action pill (icon-only,
# a11y label "Add a maintenance task") opens the add-task form.
- tapOn:
    id: "segment-service"
- tapOn:
    id: "action-pill-service"
- assertVisible: "Priority"
- inputText: ${TASK_TITLE}
- tapOn: "High"
- tapOn:
    text: "Priority"
    optional: true
- scrollUntilVisible:
    element:
      text: "Save task"
    direction: DOWN
- tapOn: "Save task"
- tapOn:
    text: "Not Now"
    optional: true
# in-app soft-ask ("Enjoying MotoVault?") can follow a save; it overlays the hub.
- tapOn:
    text: "Not really"
    optional: true
# …which then asks "Help us improve?" — decline that too.
- tapOn:
    text: "Not now"
    optional: true

# Find the task, then tap its check circle
- tapOn:
    text: ".*See all.*"
    optional: true
- scrollUntilVisible:
    element:
      text: "${TASK_TITLE}([.,].*)?"
    direction: DOWN
# The Service row's own check circle marks it done (a11y "Mark <title> done",
# bikeHub.service.markDoneA11y) and opens the completion screen.
- tapOn: "Mark ${TASK_TITLE} done"

# Complete with cost (creates linked expense)
- extendedWaitUntil:
    visible: "Completion details"
    timeout: 20000
- tapOn: "e.g. 15000"
- inputText: ${ODOMETER}
- tapOn:
    text: "Completion details"
    optional: true
- tapOn: "0.00"
- inputText: ${COST}
- tapOn:
    text: "Completion details"
    optional: true
- scrollUntilVisible:
    element:
      text: "Mark complete"
    direction: DOWN
- tapOn: "Mark complete"
- tapOn:
    text: "Not Now"
    optional: true
# in-app soft-ask ("Enjoying MotoVault?") can follow a save; it overlays the hub.
- tapOn:
    text: "Not really"
    optional: true
# …which then asks "Help us improve?" — decline that too.
- tapOn:
    text: "Not now"
    optional: true
- assertNotVisible: "Mark ${TASK_TITLE} done" # the task left the Active list — no pending check circle

# Back on the hub (Service segment). The expense created by completion carries
# the task title as its description (expenses.service createFromTask) and lives
# on the Costs segment — only the active segment is visible to accessibility, so
# the completed task card on Service cannot be matched by mistake.
- tapOn:
    id: "segment-costs"
- extendedWaitUntil:
    visible:
      id: "segment-panel-costs"
    timeout: 10000
# The expense row's label carries the task title among other parts (amount,
# category), so match it anywhere in the merged label.
- scrollUntilVisible:
    element:
      text: ".*${TASK_TITLE}.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*${TASK_TITLE}.*"

# Detail: Service record section
- extendedWaitUntil:
    visible: "Expense"
    timeout: 20000
- assertVisible: ".*88.*"
- assertVisible: "Service record"
- assertVisible: ".*View full service record.*" # merged into the service-record card label
- takeScreenshot: expense-service-record-open

- tapOn: ".*View full service record.*"
- extendedWaitUntil:
    visible: ${TASK_TITLE}
    timeout: 20000
# Completed filter should surface the task
- assertVisible: "${TASK_TITLE}([.,].*)?"
- takeScreenshot: expense-service-record-tasks
