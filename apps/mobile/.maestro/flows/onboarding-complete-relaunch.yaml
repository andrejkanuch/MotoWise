# Onboarding completion survives a cold start (issue 365 T14, FS-OB1e).
#
# Finishes onboarding, kills the app, turns airplane mode on and relaunches
# WITHOUT clearState: with no network the gate cannot refetch `me`, so it routes
# on what this install persisted (the local completion flag in the auth store).
# Expected: Home, never the onboarding Welcome screen.
#
# Guard only: Maestro cannot force the stale-cache race itself (a persisted `me`
# that still says "not completed"); navigation-gate.test.tsx covers that in Jest.
#
# Android only (Maestro `setAirplaneMode` is Android-only; iOS is Jest only).
# Run like the other authed flows (provisions and deletes the test user):
#   pnpm --filter @motovault/mobile test:e2e:onboarding-complete-relaunch
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
tags:
  - android
---
- runFlow: onboarding.yaml

- stopApp
- setAirplaneMode: enabled
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertNotVisible: "Let's get started"

# Leave the emulator online for whatever runs next.
- setAirplaneMode: disabled
