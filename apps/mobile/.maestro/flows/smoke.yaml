# Smoke test — proves the app cold-starts and renders under Maestro.
# This is the seed flow; add real journeys (log-a-ride.yaml, add-bike.yaml, …) beside it.
#
# APP_ID is injected by scripts/run-maestro.sh (defaults to com.motovault.app; override
# with APP_ID=… for a dev-client build with a different bundle id).
appId: ${APP_ID}
---
# Cold start so the flow passes from any prior state (open modal, wrong tab, etc.).
- stopApp
- launchApp
# First launch also builds the JS bundle — give it room.
- extendedWaitUntil:
    visible: ".*"
    timeout: 60000
- takeScreenshot: smoke-launch

