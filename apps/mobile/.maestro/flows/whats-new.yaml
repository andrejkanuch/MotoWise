# What's New, opened from Profile: the pages without the boot, the Road Atlas
# button hand-off to Rider insights, and the way back to the same page.
#
# Prereqs: same build and sign-in as onboarding.yaml, which this flow composes
# (a LOCAL build with RevenueCat, PostHog and Meta keys empty; never a store
# build or a production OTA). The release's three pages show for any rider on
# Profile reopen, so the account's data only changes the wording.
#
# Selectors (all from source): the Profile row "What's new"; the page counter
# "1 of 3"; the Road Atlas button ("Open my atlas" with rides, "Record my first
# ride" without); the return bar "Back to What's New" / "Next feature"; the
# Tried chip "Tried" and the tried button "Open again"; the close button "Close".
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# 1. Setup: a signed-in rider on Home.
- runFlow: onboarding.yaml

# 2. Profile › What's New opens on page 1 without the boot.
- tapOn:
    text: "Profile(,.*)?"
- scrollUntilVisible:
    element: "What's new"
    direction: DOWN
- tapOn: "What's new"
- extendedWaitUntil:
    visible: "1 of 3"
    timeout: 20000
- assertNotVisible: "Skip"
- assertVisible: "Road Atlas"

# 3. The Road Atlas button opens Rider insights with the way back.
- tapOn: "Open my atlas|Record my first ride"
- extendedWaitUntil:
    visible: "Back to What's New"
    timeout: 20000
- assertVisible: "Next feature"

# 4. Back lands on the same page, marked Tried.
- tapOn: "Back to What's New"
- extendedWaitUntil:
    visible: "1 of 3"
    timeout: 20000
- assertVisible: "Tried"
- assertVisible: "Open again"

# 5. Next feature from the bar moves to page 2.
- tapOn: "Open again"
- extendedWaitUntil:
    visible: "Next feature"
    timeout: 20000
- tapOn: "Next feature"
- extendedWaitUntil:
    visible: "2 of 3"
    timeout: 20000

# 6. Close returns to the screen beneath.
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "2 of 3"
    timeout: 10000
