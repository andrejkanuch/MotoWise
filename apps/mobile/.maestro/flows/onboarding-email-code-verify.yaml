# Email-code confirmation E2E, part 2 of 2: type the code into the code step
# left open by onboarding-email-code-signup.yaml and finish onboarding.
#
# Run through scripts/run-onboarding-email-code-e2e.sh, which passes the code it
# fetched for TEST_EMAIL as CONFIRMATION_CODE. Does NOT clear state: it relies
# on the app still showing the code step from part 1.
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
tags:
  - email-code
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Enter your code"
    timeout: 30000
- tapOn: "Confirmation code"
# Six digits auto-submit; no button to press.
- inputText: ${CONFIRMATION_CODE}

# Verified: the session lands and onboarding continues past the account step,
# either through the post-signup screens or straight to Home.
- extendedWaitUntil:
    notVisible: "Enter your code"
    timeout: 90000
- extendedWaitUntil:
    visible: ".*hear about us.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*hear about us.*"
    commands:
      - tapOn: "Instagram"
      - extendedWaitUntil:
          visible: "Enable Notifications"
          timeout: 30000
      - tapOn: "Maybe later"
      - tapOn:
          text: "Maybe later"
          optional: true
      - tapOn:
          text: "Open my garage"
          optional: true
# Home, possibly under the one landing sheet (recall or imported service plan).
# Matched by testID, not by heading copy, which changes with the rider's state.
- extendedWaitUntil:
    visible:
      id: "home-screen|recall-sheet|oem-imported-sheet"
    timeout: 120000
- tapOn:
    id: "service-plan-ready-dismiss"
    optional: true
- runFlow:
    when:
      visible:
        id: "recall-sheet"
    commands:
      - tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
