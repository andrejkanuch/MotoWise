# Odometer unit LABEL toggle — E2E for PR #165 (canonical-km normalization).
#
# The robust, no-data-entry companion to units-mileage-roundtrip.yaml. It guards
# the single most common regression: an odometer/mileage label hardcoded to "km"
# instead of following the user's global measurement_system. Toggling the global
# Units preference must flip the bike-hub odometer label between "mi" and "km" on
# the SAME bike, with no per-bike unit involved.
#
# It deliberately does NOT type an odometer (that's the round-trip flow's job), so
# it has no fragile numeric-input selector — just the Units picker and the hub's
# Gauge odometer chip. Whatever mileage the onboarding bike carries, only its unit
# suffix is asserted.
#
# Setup: composes onboarding.yaml (signed-in user + a Honda, ends at Home). Run:
#   pnpm --filter @motovault/mobile test:e2e:units-display
# Same standalone/preview-build + provisioned-user prereqs as the other authed
# flows (see README). No cleanup — the runner deletes the throwaway user.
#
# AUTHORED FROM SOURCE 2026-07-16, PENDING ON-DEVICE VALIDATION. Selectors from
# Profile → App settings → Units (testIDs profile-app-settings, app-settings-units,
# preference-option-imperial / -metric; Race Plate redesign 2026-10-09) and
# bike/[id].tsx (the Gauge odometer chip renders "<value> <unit>"). Device quirks
# per .maestro/README.md: tab a11y labels carry a badge (match tabs as partial
# regex); the odometer value + unit are sibling Text nodes, so assert the unit
# node ("mi"/"km") on its own rather than a combined regex.
# Bike hub (bike-detail redesign R1): the header odometer chip (testID
# bike-header-odometer) reads "<value> <unit>", or "Set odometer" when the bike
# has no reading. Its accessibility label is "Odometer <value> <unit>, tap to
# update", which is what Maestro sees on iOS, so the assertion pins the chip by id
# and accepts either form. The flow first records a reading through the
# Odometer sheet so the chip carries a unit at all. The unit is the bike's
# distance_unit, which the 00180 sync trigger keeps equal to the profile unit;
# the profile mutation refetches bikes so the hub follows the toggle.
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
# 1. Setup — signed-in Home with a Honda in the garage.
- runFlow: onboarding.yaml

# 2. Set Imperial, then confirm the bike hub odometer chip reads "mi".
- tapOn:
    text: "Profile(,.*)?" # the tab; ".*Profile.*" also matched Home's "Complete your bike profile"
# Units live in Profile → App settings → Units (a pushed single-choice list).
# The Profile stack may still be on App settings from an earlier step.
- runFlow:
    when:
      notVisible:
        id: "app-settings-screen"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-app-settings"
          direction: DOWN
      - tapOn:
          id: "profile-app-settings"
- tapOn:
    id: "app-settings-units"
- tapOn:
    id: "preference-option-imperial" # "Imperial (mi, °F)"
- tapOn:
    text: "Garage(,.*)?" # the tab; ".*Garage.*" also matched Home's "Today in your garage." (Maestro text matching ignores case)
- tapOn:
    text: ".*Honda.*"
- extendedWaitUntil:
    visible: "Overview" # the bike hub's first segment — the header and segment bar are up
    timeout: 20000
# Give the bike a reading so the chip shows "<value> <unit>" (the app's own
# keypad — no system keyboard). If the bike already had a higher reading, the
# optional "Save" answers the lower-than-last confirmation.
- tapOn:
    id: "bike-header-odometer"
- extendedWaitUntil:
    visible:
      id: "odometer-save"
    timeout: 10000
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-2"
- tapOn:
    id: "key-3"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-5"
- waitForAnimationToEnd # Save stays disabled until the readings history has loaded
- tapOn:
    id: "odometer-save"
- tapOn:
    text: "Save" # lower-than-last confirmation (common.save)
    optional: true
- extendedWaitUntil:
    visible:
      id: "bike-header-odometer"
      text: "(Odometer )?[0-9,.]+ mi(,.*)?" # "<value> mi" or its a11y label
    timeout: 10000
- takeScreenshot: units-label-imperial

# 3. Switch to Metric; the SAME bike's odometer chip must now read "km".
- tapOn:
    text: "Profile(,.*)?" # the tab; ".*Profile.*" also matched Home's "Complete your bike profile"
# Units live in Profile → App settings → Units (a pushed single-choice list).
# The Profile stack may still be on App settings from an earlier step.
- runFlow:
    when:
      notVisible:
        id: "app-settings-screen"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-app-settings"
          direction: DOWN
      - tapOn:
          id: "profile-app-settings"
- tapOn:
    id: "app-settings-units"
- tapOn:
    id: "preference-option-metric" # "Metric (km, °C)"
- tapOn:
    text: "Garage(,.*)?" # the tab; ".*Garage.*" also matched Home's "Today in your garage." (Maestro text matching ignores case)
- tapOn:
    text: ".*Honda.*"
- extendedWaitUntil:
    visible: "Overview" # the bike hub's first segment — the header and segment bar are up
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "bike-header-odometer"
      text: "(Odometer )?[0-9,.]+ km(,.*)?" # same reading, now labelled km
    timeout: 10000
- takeScreenshot: units-label-metric
