# Delete an expense via long-press on the list row (gesture path).
#
# WHY: delete-expense.yaml covers row-tap → detail → Delete. Swipe-past-threshold
# is not reliably scriptable in Maestro (on-device 2026-07-15); long-press (500ms)
# is the supported alternate gesture on SwipeableExpense and is Maestro-operable
# via longPressOn (same as log-ride.yaml Hold-to-end).
#
# Setup: composes onboarding.yaml. Run via:
#   pnpm --filter @motovault/mobile test:e2e:delete-expense-long-press
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
  EXPENSE_LABEL: "E2E Long Press Delete Me"
---
- runFlow: onboarding.yaml

- tapOn:
    text: "Garage(,.*)?" # the tab; ".*Garage.*" also matched Home's "Today in your garage." (Maestro text matching ignores case)
- tapOn:
    text: ".*Honda.*"
- extendedWaitUntil:
    visible: "Overview" # the bike hub's first segment — the header and segment bar are up
    timeout: 20000
# Expenses live on the Costs segment of the bike hub.
- tapOn:
    id: "segment-costs"
- extendedWaitUntil:
    visible:
      id: "segment-panel-costs"
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "No expenses yet(,.*)?"
    direction: DOWN
- tapOn: "No expenses yet(,.*)?"
- assertVisible: "AMOUNT"
- inputText: "18.25"
- tapOn:
    text: "CATEGORY" # non-interactive label — dismisses the custom amount keypad first
    optional: true
- scrollUntilVisible:
    element:
      text: "DETAILS"
    direction: DOWN
- tapOn:
    text: ".*What was this expense for.*"
- inputText: ${EXPENSE_LABEL}
- tapOn:
    text: "DETAILS"
    optional: true
- scrollUntilVisible:
    element:
      text: "Save Expense"
    direction: DOWN
- tapOn: "Save Expense"
- tapOn:
    text: "Not Now"
    optional: true
# in-app soft-ask ("Enjoying MotoVault?") can follow a save; it overlays the hub.
- tapOn:
    text: "Not really"
    optional: true
# …which then asks "Help us improve?" — decline that too.
- tapOn:
    text: "Not now"
    optional: true
# After saving, the form scrolls back to the top; "Done" replaces the Save
# button below the fold, so scroll to it rather than wait for it on screen.
- scrollUntilVisible:
    element:
      text: "Done"
    direction: DOWN
    timeout: 20000
- tapOn: "Done"

# Back on the Costs segment (the hub remembers it). The segment's content is
# short, so the row sits well above the action pill and the tab bar.
- scrollUntilVisible:
    element:
      text: ".*${EXPENSE_LABEL}.*"
    direction: DOWN
- assertVisible: ".*${EXPENSE_LABEL}.*"

# Long-press the row → native Delete Expense alert (does not open detail).
- longPressOn:
    text: ".*${EXPENSE_LABEL}.*"
- tapOn:
    text: "Delete"
    rightOf:
      text: "Cancel"
- takeScreenshot: delete-expense-long-press-confirmed

- extendedWaitUntil:
    notVisible: ${EXPENSE_LABEL}
    timeout: 30000
- assertNotVisible:
    text: ".*${EXPENSE_LABEL}.*"
