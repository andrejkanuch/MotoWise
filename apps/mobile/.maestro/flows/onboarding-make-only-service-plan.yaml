# FS-PO1H make-only branch (issue 365 T07a/T07b, Experiment 2): "Not sure of the
# details?" → Honda chip creates a make-only bike, which gets the Honda
# make-generic plan (10 rows). Home shows a next service item, the Service
# segment lists the tasks and says whose schedule they are ("Honda schedule" —
# the make-level tier: no model-level claim).
#
# Run: pnpm --filter @motovault/mobile test:e2e:service-plan-make-only (fresh
# user per run, scripts/run-onboarding-e2e.sh). Same build and backend needs as
# onboarding-service-plan.yaml; red on a build from main before T07a.
appId: ${APP_ID}
env:
  APP_ID: com.motovault.app
---
- runFlow:
    file: onboarding.yaml
    env:
      MAKE_ONLY: "true"

- extendedWaitUntil:
    notVisible: "No service due"
    timeout: 20000
- assertNotVisible: "No service due"
- extendedWaitUntil:
    visible:
      id: "home-up-next"
    timeout: 20000
- takeScreenshot: service-plan-make-only-home

- tapOn:
    id: "tab-garage"
- tapOn:
    id: "garage-bike-plate-.*"
- extendedWaitUntil:
    visible:
      id: "segment-service"
    timeout: 20000
- tapOn:
    id: "segment-service"
- extendedWaitUntil:
    visible:
      id: "service-task-card-0"
    timeout: 10000

# The tier label: a single-limit task carries "Honda schedule" on its due line.
# Active shows three tasks; open the rest ("+N more") so every row is on screen.
- tapOn:
    id: "service-more"
    optional: true
- scrollUntilVisible:
    element: ".*Honda schedule.*"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*Honda schedule.*"
- takeScreenshot: service-plan-make-only-service
