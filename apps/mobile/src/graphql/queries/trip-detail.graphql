query TripDetail($tripId: ID!) {
  tripDetail(tripId: $tripId) {
    id
    title
    description
    startDate
    endDate
    difficulty
    maxRiders
    participantCount
    status
    visibility
    coverImageUrl
    createdAt
    isTemplate
    slug
    polyline
    startLat
    startLng
    countryCode
    regionCode
    city
    distanceM
    elevationGainM
    estimatedDurationMinutes
    surfaceType
    curvatureIndex
    dayCount
    isFeatured
    isMotovaultPick
    viewCount
    cloneCount
    averageRating
    reviewCount
    publishedAt
    isFlagged
    isSaved
    clonedFromTripId
    forkedFromTripId
    organiser {
      id
      displayName
      publicUsername
      avatarUrl
    }
    waypoints {
      id
      tripId
      sortOrder
      dayIndex
      periodOfDay
      type
      name
      notes
      lat
      lng
      createdAt
    }
    participants {
      id
      displayName
      publicUsername
      avatarUrl
      role
      status
      bikeId
      joinedAt
    }
  }
}
