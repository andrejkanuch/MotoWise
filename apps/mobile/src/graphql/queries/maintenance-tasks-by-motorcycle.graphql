query MaintenanceTasksByMotorcycle($motorcycleId: String!) {
  maintenanceTasks(motorcycleId: $motorcycleId) {
    id
    userId
    motorcycleId
    title
    description
    dueDate
    targetMileage
    priority
    status
    notes
    partsNeeded
    completedAt
    completedMileage
    cost
    partsCost
    laborCost
    totalAmount
    taxAmount
    taxRate
    currency
    source
    isRecurring
    intervalKm
    intervalDays
    remind30d
    remind7d
    remind1d
    photos {
      id
      storagePath
      publicUrl
    }
    lineItems {
      id
      serviceType
      label
      lineTotal
    }
    createdAt
    updatedAt
  }
}
