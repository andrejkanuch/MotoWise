query MyMotorcycles {
  myMotorcycles {
    id
    userId
    make
    model
    year
    nickname
    isPrimary
    primaryPhotoUrl
    currentMileage
    mileageUnit
    mileageUpdatedAt
    purchasePrice
    purchaseDate
    type
    engineCc
    vin
    recallCount
    recallLastCheckedAt
    odometerSyncSource
    odometerLastRideId
    createdAt
  }
}
