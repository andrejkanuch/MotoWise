query GetRouteReviews($routeId: ID!, $first: Int, $after: String) {
  getRouteReviews(routeId: $routeId, first: $first, after: $after) {
    reviews {
      id
      rating
      text
      conditionTags
      createdAt
      author {
        id
        displayName
        publicUsername
        avatarUrl
      }
      bike {
        make
        model
        year
      }
    }
    hasNextPage
    endCursor
    totalCount
  }
}
