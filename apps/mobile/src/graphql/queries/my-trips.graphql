query MyTrips($first: Int, $after: String) {
  myTrips(first: $first, after: $after) {
    edges {
      node {
        id
        title
        description
        startDate
        endDate
        difficulty
        maxRiders
        participantCount
        status
        visibility
        coverImageUrl
        createdAt
        waypoints {
          id
        }
        organiser {
          id
          displayName
          publicUsername
          avatarUrl
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
