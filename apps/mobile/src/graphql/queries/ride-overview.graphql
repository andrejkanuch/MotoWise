query RideOverview {
  rideOverview {
    lastRide {
      id
      distanceM
      durationS
      maxSpeedMps
      date
      motorcycleName
    }
    last7Days {
      rideCount
      distanceM
      durationS
    }
    thisWeek {
      rideCount
      distanceM
      durationS
    }
    thisMonth {
      rideCount
      distanceM
      durationS
    }
    currentStreak
    personalRecords {
      recordType
      value
      unit
      achievedAt
      previousValue
      rideId
    }
  }
}
