query ExpensesByMotorcycle($motorcycleId: String!, $year: Int!) {
  expenses(motorcycleId: $motorcycleId, year: $year) {
    ytdTotal
    currencyTotals {
      currency
      total
      count
    }
    categories {
      category
      total
      currencyTotals {
        currency
        total
        count
      }
      expenses {
        id
        amount
        category
        currency
        description
        itemName
        maintenanceTaskId
        date
        createdAt
      }
    }
  }
}
