query GetFollowing($userId: String!, $first: Int, $after: String) {
  getFollowing(userId: $userId, first: $first, after: $after) {
    edges {
      node {
        followerId
        followingId
        createdAt
        displayName
        publicUsername
        avatarUrl
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}
