query DiscoverRoutesMap($filter: DiscoverRoutesFilterInput, $first: Int, $after: String) {
  discoverRoutes(filter: $filter, first: $first, after: $after) {
    edges {
      node {
        id
        name
        polyline
        startLat
        startLng
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
