# @deprecated — Use trip-based equivalent. Kept for backward compatibility with old app builds.
query RouteDetail($routeId: ID!) {
  routeDetail(routeId: $routeId) {
    id
    name
    description
    polyline
    distanceM
    elevationGainM
    surfaceType
    curvatureIndex
    isMotovaultPick
    editorialDescription
    ratingAvg
    ratingCount
    commentCount
    status
    createdAt
    contributor {
      id
      displayName
      publicUsername
      avatarUrl
    }
  }
}
