query DocumentsByMotorcycle($motorcycleId: String!) {
  documents(motorcycleId: $motorcycleId) {
    id
    motorcycleId
    categoryId
    title
    expiryDate
    note
    isPinned
    createdAt
    updatedAt
    files {
      id
      documentId
      mimeType
      fileSizeBytes
      createdAt
    }
  }
}
