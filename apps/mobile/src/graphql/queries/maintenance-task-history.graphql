query MaintenanceTaskHistory($motorcycleId: String!, $limit: Int) {
  maintenanceTaskHistory(motorcycleId: $motorcycleId, limit: $limit) {
    id
    userId
    motorcycleId
    title
    description
    dueDate
    targetMileage
    priority
    status
    notes
    partsNeeded
    completedAt
    completedMileage
    cost
    partsCost
    laborCost
    totalAmount
    taxAmount
    taxRate
    currency
    source
    oemScheduleId
    intervalKm
    intervalDays
    isRecurring
    lineItems {
      id
      serviceType
      label
      lineTotal
    }
    createdAt
    updatedAt
  }
}
