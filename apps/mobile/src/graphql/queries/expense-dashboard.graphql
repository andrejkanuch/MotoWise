query ExpenseDashboard($motorcycleId: String!) {
  expenseDashboard(motorcycleId: $motorcycleId) {
    currentYearTotal
    previousYearTotal
    allTimeTotal
    expenseCount
    monthlyBuckets {
      month
      year
      fuel
      maintenance
      parts
      gear
      total
    }
    categoryTotals {
      category
      total
    }
  }
}
