query TripReviews($tripId: ID!, $first: Int, $after: String) {
  tripReviews(tripId: $tripId, first: $first, after: $after) {
    id
    rating
    text
    conditionTags
    createdAt
    tripId
    userId
    bikeId
    author {
      id
      displayName
      publicUsername
      avatarUrl
    }
    bike {
      make
      model
      year
      type
    }
  }
}
