query GetRiderProfile($username: String!) {
  getRiderProfile(username: $username) {
    id
    publicUsername
    displayName
    bio
    city
    avatarUrl
    followerCount
    followingCount
    isFollowing
    bikes {
      make
      model
      year
      nickname
    }
    rideStats {
      totalRides
      totalDistance
      joinDate
    }
  }
}
