mutation UpdateMotorcycle($id: String!, $input: UpdateMotorcycleInput!) {
  updateMotorcycle(id: $id, input: $input) {
    id
    make
    model
    year
    nickname
    variant
    isPrimary
    primaryPhotoUrl
    currentMileage
    mileageUnit
    mileageUpdatedAt
    purchasePrice
    purchaseDate
    vin
    recallCount
    recallLastCheckedAt
  }
}
