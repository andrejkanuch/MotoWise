mutation CreateNote($input: CreateNoteInput!) {
  createNote(input: $input) {
    id
    motorcycleId
    text
    odometer
    createdAt
    updatedAt
    linkedTaskId
    linkedTaskTitle
    linkedExpenseId
    linkedExpenseAmount
    linkedExpenseCurrency
    photos {
      id
      storagePath
      publicUrl
    }
  }
}
