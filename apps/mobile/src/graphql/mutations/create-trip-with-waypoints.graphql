mutation CreateTripWithWaypoints($input: CreateTripWithWaypointsInput!) {
  createTripWithWaypoints(input: $input) {
    id
    title
    description
    startDate
    endDate
    datesPending
    difficulty
    maxRiders
    status
    visibility
    createdAt
    organiser {
      id
      displayName
    }
    waypoints {
      id
      tripId
      sortOrder
      dayIndex
      periodOfDay
      type
      name
      notes
      lat
      lng
    }
  }
}
