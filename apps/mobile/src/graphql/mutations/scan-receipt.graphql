mutation ScanReceipt($scanId: String!) {
  scanReceipt(scanId: $scanId) {
    __typename
    ... on ReceiptScanSuccess {
      scanId
      result {
        type
        amount
        currency
        date
        vendor
        itemName
        category
        partsCost
        laborCost
        odometerValue
        odometerUnit
        fuelLitres
        partsNeeded
        legibilityNote
        needsCheck
        fieldConfidence {
          amount
          currency
          date
          vendor
          category
          odometer
        }
      }
    }
    ... on ReceiptScanError {
      code
      reason
    }
  }
}
