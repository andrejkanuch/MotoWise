mutation EndRide($input: EndRideInput!) {
  endRide(input: $input) {
    ride {
      id
      status
      endedAt
      distanceM
      maxSpeedMps
      avgSpeedMps
      elevationGain
      elevationLoss
      pausedDurationS
      autoPausedDurationS
      gpsQuality
      routePolyline
      mileageApplied
    }
    triggeredMaintenanceTasks {
      id
      title
      priority
    }
  }
}
