query PublicSavedRoutes($handle: String!, $first: Int, $after: String) {
  publicSavedRoutes(handle: $handle, first: $first, after: $after) {
    edges {
      node {
        id
        name
        distanceM
        elevationGainM
        surfaceType
        isMotovaultPick
        ratingAvg
        ratingCount
        commentCount
        contributor {
          id
          displayName
          publicUsername
          avatarUrl
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
