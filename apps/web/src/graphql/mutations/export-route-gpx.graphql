# @deprecated — Use trip-based equivalent. Kept for backward compatibility.
mutation ExportRouteGPX($routeId: ID!) {
  exportRouteGPX(routeId: $routeId) {
    ... on GPXExportSuccess {
      fileUrl
      fileName
      message
    }
    ... on GPXExportError {
      code
      reason
      quotaRemaining
      upgradeUrl
    }
  }
}
