query ExpenseDashboard($motorcycleId: String!) {
  expenseDashboard(motorcycleId: $motorcycleId) {
    currentYearTotal
    previousYearTotal
    allTimeTotal
    expenseCount
    monthlyBuckets {
      month
      year
      categories {
        category
        total
      }
      total
    }
    categoryTotals {
      category
      total
    }
  }
}
