query RouteBySlug($country: String!, $region: String!, $slug: String!) {
  routeBySlug(country: $country, region: $region, slug: $slug) {
    id
    name
    description
    distanceM
    elevationGainM
    surfaceType
    curvatureIndex
    isMotovaultPick
    editorialDescription
    ratingAvg
    ratingCount
    commentCount
    startLat
    startLng
    slug
    countryCode
    regionCode
    contributor {
      id
      displayName
      publicUsername
      avatarUrl
    }
  }
}
