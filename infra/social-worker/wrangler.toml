name = "motovault-social-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Cron triggers replace the claude.ai scheduled tasks. These run on Cloudflare
# infrastructure — no Claude Code sandbox, no egress allowlist.
#
# Slots map 1:1 to social_post_queue.slot values:
#   afternoon      -> 14:00 UTC (Europe afternoon / Americas morning)
#   evening        -> 19:00 UTC (Europe evening)
#   night-americas -> 00:00 UTC (Americas evening)
[triggers]
crons = [
  "0 14 * * *",
  "0 19 * * *",
  "0 0 * * *",
]

[observability]
enabled = true

# NOTE: this Worker is on the FREE plan (10ms CPU) — keep heavy pixel work
# (PNG decode/encode, compositing) out of the Worker; it gets killed with
# error 1102.

# Bundle markdown files as Text modules so src/content-references.ts can
# import brand-voice reference docs at build time via `import md from "../../../path.md"`.
# Wrangler's default loaders do NOT cover .md (only .txt/.html/.sql/.bin/.wasm).
# fallthrough=true preserves the default rules alongside this one.
# https://developers.cloudflare.com/workers/wrangler/configuration/#bundling
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# WASM modules for @resvg/resvg-wasm (image compositing)
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[kv_namespaces]]
binding = "JOBS"
id = "9ff008b49b2049fea31ddc178b33fc1c"

# Secrets (set via `npx wrangler secret put <NAME>`, never commit):
#   META_API_KEY
#   META_PAGE_ID
#   META_IG_USER_ID
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   <-- NEW: required for social_post_queue RLS bypass
#   GOOGLE_AI_STUDIO_KEY
#   WORKER_AUTH_KEY
